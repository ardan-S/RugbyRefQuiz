metadata:
  law: 3
  title: The Team
  source: World Rugby Laws 2026
questions:
- id: L03-001
  text: |-
    A team has too many players in the playing area during play. The referee orders the captain to reduce the number of players. Sanction:
  type: sanction
  difficulty: intermediate
  options:
  - Penalty
  - Free kick
  - Scrum
  - Play advantage
  - Other
  answers:
  - Penalty
  law_reference: '3'
  tags:
  - referee
  - captain
  - sanction
  explanation: null
  contributor: null
- id: L03-002
  text: |-
    A team has too many players in the playing area during play. The referee orders the captain to reduce the number of players. Adjustment to the score:
  type: sanction
  difficulty: intermediate
  options:
  - Reduced by a try (5 pts)
  - Reduced by a penalty (3 pts)
  - No change
  - Reduced by a conversion (2 pts)
  answers:
  - No change
  law_reference: '3'
  tags:
  - referee
  - captain
  - sanction
  explanation: null
  contributor: null
- id: L03-003
  text: |-
    A player or replacement rejoins the match without the referee's permission. The referee believes the player did so to gain an advantage. Sanction:
  type: sanction
  difficulty: intermediate
  options:
  - Penalty
  - Free kick
  - Scrum
  - Play advantage
  - Other
  answers:
  - Penalty
  law_reference: '3'
  tags:
  - advantage
  - replacement
  - referee
  - sanction
  explanation: null
  contributor: null
- id: L03-004
  text: How many players can each team have in the playing area during play?
  type: factual
  difficulty: advanced
  options:
  - '15'
  - '16'
  - '17'
  - '18'
  - '19'
  - '20'
