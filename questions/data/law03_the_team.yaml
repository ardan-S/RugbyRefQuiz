- id: L03-021
  text: Under what circumstances do scrums become uncontested? (2 correct answers)
  type: factual
  difficulty: advanced
  options:
  - Either team cannot field a suitably trained front row
  - The referee orders so
  - Both teams agree
  - All of the above
  answers:
  - Either team cannot field a suitably trained front row
  - The referee orders so
  law_reference: '3'
  tags:
  - scrum
  explanation: null
  contributor: null
- id: L03-022
  text: |-
    True or false: a match organiser may stipulate conditions under which a game may start with uncontensted scrums?
  type: factual
  difficulty: beginner
  options:
  - 'True'
  - 'False'
  answers:
  - 'True'
  law_reference: '3'
  tags:
  - scrum
  explanation: null
  contributor: null
- id: L03-023
  text: |-
    How many players per side must play in an uncontested scrum which resulted from a sending off, temporary suspension or injury?
  type: factual
  difficulty: intermediate
  options:
  - '3'
  - '5'
  - '6'
  - '7'
  - '8'
  answers:
  - '8'
  law_reference: '3'
  tags:
  - scrum
  - injury
  - suspension
  - sending-off
  explanation: null
  contributor: null
- id: L03-024
  text: |-
    Weather through injury, temporary or permanent suspension, a front-row player leaves the playing area. At the next scrum, the referee is informed the team will not be able to contest the scrum. What must the referee do?
  type: factual
  difficulty: advanced
  options:
  - Ask for another player to join the scrum
  - Order uncontested scrums
  - Play with that position in the scrum vacant
  answers:
  - Order uncontested scrums
  law_reference: '3'
  tags:
  - scrum
  - injury
  - front-row
  - referee
  - suspension
  explanation: null
  contributor: null
- id: L03-025
  text: |-
    If uncontested scrums have been ordered but a front-row player comes on, may contested scrums continue?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'Yes'
  law_reference: '3'
  tags:
  - scrum
  - front-row
  explanation: null
  contributor: null
- id: L03-026
  text: |-
    In a squad of 23, or at the discretion of the match organiser, can a player whose departure has caused the referee to order uncontested scrums be replaced?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'No'
  law_reference: '3'
  tags:
  - scrum
  - referee
  explanation: null
  contributor: null
- id: L03-027
  text: |-
    Can a non-front-row player play in the front row if a front-row player is available?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'No'
  law_reference: '3'
  tags:
  - front-row
  explanation: null
  contributor: null
- id: L03-028
  text: |-
    True or false: if a front-row player is temporarily suspended, and the team cannot continue with contested scrums with the players on the field, the team nominates a player to leave the playing area to enable an available front-row player to come on. The nominated player may not return until the suspension period ends?
  type: factual
  difficulty: beginner
  options:
  - 'True'
  - 'False'
  answers:
  - 'True'
  law_reference: '3'
  tags:
  - scrum
  - front-row
  - suspension
  explanation: null
  contributor: null
- id: L03-029
  text: |-
    True or false: if a front-row player is sent off, and the team cannot continue with contested scrums with the players on the field, the team nominates a player to leave the playing area to enable an available front-row player to come on. The nominated player may return until the end of the match?
  type: factual
  difficulty: beginner
  options:
  - 'True'
  - 'False'
  answers:
  - 'True'
  law_reference: '3'
  tags:
  - scrum
  - front-row
  - sending-off
  explanation: null
  contributor: null
- id: L03-030
  text: 'True or false: an injured player may return having been replaced?'
  type: factual
  difficulty: beginner
  options:
  - 'True'
  - 'False'
  answers:
  - 'False'
  law_reference: '3'
  tags: []
  explanation: null
  contributor: null
- id: L03-031
  text: Under which of these conditions is a player NOT deemed to be injured?
  type: factual
  difficulty: intermediate
  options:
  - |-
    At national level, it is the opinion of a doctor that it would be inadvisable for the player to continue
  - |-
    In other matches, where a match organiser has given explicit permission, it is the opinion of a medically trained person that it would be inadvisable for the player to continue. If none is present, the player may be replaced if the referee agrees
  - |-
    The referee decides (with or without medical advice) that it would be inadvisable for the player to continue
  - |-
    It is the opinion of the team captain that it would be inadvisable for the player to continue
  answers:
  - |-
    It is the opinion of the team captain that it would be inadvisable for the player to continue
  law_reference: '3'
  tags: []
  explanation: null
  contributor: null
- id: L03-032
  text: |-
    True or false: a referee may order an injured player to leave the playing area to be medically examined?
  type: factual
  difficulty: beginner
  options:
  - 'True'
  - 'False'
  answers:
  - 'True'
  law_reference: '3'
  tags:
  - referee
  explanation: null
  contributor: null
- id: L03-033
  text: What is the process known as "Recognise and Remove"?
  type: procedural
  difficulty: intermediate
  options:
  - Immediate and permanent removal of a blood injury
  - |-
    Immediate and permanent removal of a player who has committed an act of foul play
  - |-
    Immediate and permanent removal of a player who is concussed or has suspected concussion
  - |-
    Immediate and permanent removal of a player not deemed to be of sufficient standard
  answers:
  - |-
    Immediate and permanent removal of a player who is concussed or has suspected concussion
  law_reference: '3'
  tags: []
  explanation: null
  contributor: null
- id: L03-034
  text: 'True or false: a player with a blood injury may be temporarily replaced?'
  type: factual
  difficulty: beginner
  options:
  - 'True'
  - 'False'
  answers:
  - 'True'
  law_reference: '3'
  tags:
  - injury
  - blood-injury
  explanation: null
  contributor: null
- id: L03-035
  text: |-
    A player with a blood injury is replaced. How long does the replacement have to return to the field before the replacement becomes permenant?
  type: factual
  difficulty: advanced
  options:
  - 5 minutes
  - 10 minutes
  - 15 minutes
  - 20 minutes
  - 25 minutes
  - 30 minutes
  answers:
  - 15 minutes
  law_reference: '3'
  tags:
  - injury
  - blood-injury
  - replacement
  explanation: null
  contributor: null
- id: L03-036
  text: |-
    True or false: a temporary replacement can be temporarily replaced, even if all replacements have been used?
  type: factual
  difficulty: beginner
  options:
  - 'True'
  - 'False'
  answers:
  - 'True'
  law_reference: '3'
  tags:
  - replacement
  explanation: null
  contributor: null
- id: L03-037
  text: If a temporary replacement is injured, can they be replaced?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'Yes'
  law_reference: '3'
  tags:
  - replacement
  explanation: null
  contributor: null
- id: L03-038
  text: |-
    If a temporary replacement is sent off can the originally replaced player return to the playing area?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  - No with 2 lawful exceptions
  - Yes with 2 lawful exceptions
  answers:
  - No with 2 lawful exceptions
  law_reference: '3'
  tags:
  - replacement
  - sending-off
  explanation: null
  contributor: null
- id: L03-039
  text: |-
    If the time allowed for a temporary replacement elapses during half-time, can the replaced player return?
  type: factual
  difficulty: intermediate
  options:
  - 'No'
  - The time continues after the second half begins
  - Only if replaced player returns immediately at the start of the second half
  - The replacement is replaced, then the original player may return
  answers:
  - Only if replaced player returns immediately at the start of the second half
  law_reference: '3'
  tags:
  - replacement
  - time
  - half-time
  explanation: null
  contributor: null
- id: L03-040
  text: |-
    Which is NOT a valid reason for a tactically replaced player to return to the playing area? When replacing:
  type: factual
  difficulty: advanced
  options:
  - An injured front-row player
  - A player with a blood injury
  - A player with a head injury
  - A player who has been injured as a result of foul play
  - A nominated player described in Law 3.19 or 3.20
  - The captain to come on as captain
  answers:
  - The captain to come on as captain
  law_reference: '3'
  tags: []
  explanation: null
  contributor: null
- id: L03-041
  text: Who is responsible for implementing rolling tactical replacements?
  type: factual
  difficulty: intermediate
  options:
