- id: L03-017
  text: |-
    Where the match organiser has determined squad sizes of 23 and a team is able to nominate only two front-row replacements, how many players may be nominated to their squad?
  type: factual
  difficulty: intermediate
  options:
  - '21'
  - '22'
  - '23'
  answers:
