- id: L03-042
  text: What is the maximum number of rolling tactical replacements allowed?
  type: factual
  difficulty: advanced
  options:
  - '8'
  - '10'
  - '12'
  - '14'
  - '16'
  - '18'
  answers:
  - '12'
