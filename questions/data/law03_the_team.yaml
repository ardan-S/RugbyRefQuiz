metadata:
  law: 3
  title: The Team
  source: World Rugby Laws 2026
questions:
- id: L03-001
  text: Blue object that Red have 16 players in the playing area. The objection
    is upheld. What do you award?
  type: sanction
  difficulty: intermediate
  options:
  - Penalty to Blue, and Red's captain must reduce the number
  - Free-kick to Blue, and Red's captain must reduce the number
  - No sanction - Red simply remove a player
  - Scrum to Blue at the place of the objection
  answers:
  - Penalty to Blue, and Red's captain must reduce the number
  law_reference: '3.3'
  tags:
  - sanction
  - captain
  law_quote: 'If a team has too many players, the referee orders the captain of
    that team to reduce the number appropriately. The score at the time of the objection
    remains unaltered. Sanction: Penalty.'
  explanation: Two parts to remember - it is a penalty offence, AND any points
    already scored stand.
  contributor: null
- id: L03-002
  text: A team is found to have had too many players on the field. What happens
    to points they scored while over-manned?
  type: factual
  difficulty: intermediate
  options:
  - The score is unaltered
  - Tries scored in that period are disallowed
  - The referee decides how many points to remove
  - The match is forfeited
  answers:
  - The score is unaltered
  law_reference: '3.3'
  tags:
  - captain
  law_quote: The score at the time of the objection remains unaltered.
  explanation: The remedy is the penalty and correcting the numbers - not rewriting
    the scoreboard.
  contributor: null
- id: L03-003
  text: A replaced player rejoins the match without your permission, and you believe
    they did so to gain an advantage. What do you award?
  type: sanction
  difficulty: intermediate
  options:
  - Penalty - the player is guilty of misconduct
  - Free-kick
  - Scrum to the opposition
  - No sanction, but the player must leave again
  answers:
  - Penalty - the player is guilty of misconduct
  law_reference: '3.7'
  tags:
  - sanction
  - replacement
  law_quote: 'If a player re-joins or a replacement joins the match without the
    referee''s permission and the referee believes the player did so to gain an advantage,
    the player is guilty of misconduct. Sanction: Penalty.'
  explanation: The advantage-seeking element is what makes it misconduct - an innocent
    miscommunication is normally managed with a word rather than a whistle.
  contributor: null
- id: L03-004
  text: What is the maximum number of players each team may have in the playing
    area during play?
  type: factual
  difficulty: beginner
  options:
  - '15'
  - '13'
  - '16'
  - '23'
  answers:
  - '15'
  law_reference: '3.1'
  tags: []
  law_quote: Each team has no more than 15 players in the playing area during play.
  explanation: The matchday squad may be up to 23, but only 15 per team on the field.
  contributor: null
- id: L03-005
  text: Who can authorise matches to be played with fewer than 15 players in each
    team?
  type: factual
  difficulty: intermediate
  options:
  - The match organiser
  - The referee
  - World Rugby
  - The two captains, by agreement
  answers:
  - The match organiser
  law_reference: '3.2'
  tags: []
  law_quote: A match organiser may authorise matches to be played with fewer than
    15 players in each team.
  explanation: null
  contributor: null
- id: L03-006
  text: How many replacements may a union nominate for an international match?
  type: factual
  difficulty: beginner
  options:
  - Up to 8
  - Up to 7
  - Up to 6
  - Up to 10
  answers:
  - Up to 8
  law_reference: '3.4'
  tags:
  - replacement
  law_quote: For international matches, a union may nominate up to eight replacements.
  explanation: null
  contributor: null
- id: L03-007
  text: For non-international matches, who decides how many replacements may be
    nominated (up to the maximum of eight)?
  type: factual
  difficulty: intermediate
  options:
  - The match organiser
  - The referee
  - World Rugby
  - The home team
  answers:
  - The match organiser
  law_reference: '3.5'
  tags:
  - replacement
  law_quote: For other matches, the match organiser decides how many replacements
    may be nominated, up to a maximum of eight.
  explanation: null
  contributor: null
- id: L03-008
  text: When may replacements be made?
  type: procedural
  difficulty: beginner
  options:
  - Only when the ball is dead, and only with the referee's permission
  - At any stoppage, without needing permission
  - Whenever the ball is dead, no permission needed
  - Only at half-time or after a score
  answers:
  - Only when the ball is dead, and only with the referee's permission
  law_reference: '3.6'
  tags:
  - replacement
  - referee
  law_quote: Replacements are made only when the ball is dead and only with the
    permission of the referee.
  explanation: In practice this is usually managed by the fourth official or assistant,
    but the authority is the referee's.
  contributor: null
- id: L03-010
  text: What is the minimum number of front-row players required in a squad of 15
    or fewer?
  type: factual
  difficulty: advanced
  options:
  - '3'
  - '4'
  - '5'
  - '6'
  answers:
  - '3'
  law_reference: '3.8'
  tags:
  - front-row
  law_quote: 'Front-row table (Law 3.8): squad of 15 or fewer - 3 front-row players;
    16-18 - 4; 19-22 - 5; 23 - 6.'
  explanation: The ladder is worth memorising as a block - 3, 4, 5, 6 front-rowers
    as the squad grows through 15, 16-18, 19-22 and 23.
  contributor: null
- id: L03-011
  text: What is the minimum number of front-row players required in a squad of 16,
    17 or 18?
  type: factual
  difficulty: advanced
  options:
  - '4'
  - '3'
  - '5'
  - '6'
  answers:
  - '4'
  law_reference: '3.8'
  tags:
  - front-row
  law_quote: 'Front-row table (Law 3.8): squad of 15 or fewer - 3 front-row players;
    16-18 - 4; 19-22 - 5; 23 - 6.'
  explanation: With 4 front-rowers, the squad must be able to replace either a prop
    or a hooker at the first time of asking.
  contributor: null
- id: L03-012
  text: What is the minimum number of front-row players required in a squad of 19
    to 22?
  type: factual
  difficulty: advanced
  options:
  - '5'
  - '4'
  - '6'
  - '3'
  answers:
  - '5'
  law_reference: '3.8'
  tags:
  - front-row
  law_quote: 'Front-row table (Law 3.8): squad of 15 or fewer - 3 front-row players;
    16-18 - 4; 19-22 - 5; 23 - 6.'
  explanation: With 5 front-rowers, the squad must be able to replace both a prop
    and a hooker at the first time of asking.
  contributor: null
- id: L03-013
  text: What is the minimum number of front-row players required in a squad of 23?
  type: factual
  difficulty: advanced
  options:
  - '6'
  - '5'
  - '4'
  - '7'
  answers:
  - '6'
  law_reference: '3.8'
  tags:
  - front-row
  law_quote: 'Front-row table (Law 3.8): squad of 15 or fewer - 3 front-row players;
    16-18 - 4; 19-22 - 5; 23 - 6.'
  explanation: A 23-player squad must be able to replace the loose-head prop, tight-head
    prop and hooker, each at the first time of asking.
  contributor: null
- id: L03-014
  text: At the first time of asking, who must a squad of 16, 17 or 18 be able to
    replace?
  type: factual
  difficulty: intermediate
  options:
  - Either a prop or a hooker
  - Both a prop and a hooker
  - Loose-head prop, tight-head prop and hooker
  - There is no replacement obligation
  answers:
  - Either a prop or a hooker
  law_reference: '3.8'
  tags:
  - front-row
  - replacement
  law_quote: 'Front-row table (Law 3.8): squad of 16, 17 or 18 - must be able to
    replace either a prop or a hooker at the first time of asking.'
  explanation: null
  contributor: null
- id: L03-015
  text: At the first time of asking, who must a squad of 19 to 22 be able to replace?
  type: factual
  difficulty: intermediate
  options:
  - Both a prop and a hooker
  - Either a prop or a hooker
  - Loose-head prop, tight-head prop and hooker
  - There is no replacement obligation
  answers:
  - Both a prop and a hooker
  law_reference: '3.8'
  tags:
  - front-row
  - replacement
  law_quote: 'Front-row table (Law 3.8): squad of 19, 20, 21 or 22 - must be able
    to replace both a prop and a hooker at the first time of asking.'
  explanation: null
  contributor: null
- id: L03-016
  text: At the first time of asking, who must a squad of 23 be able to replace?
  type: factual
  difficulty: intermediate
  options:
  - Loose-head prop, tight-head prop and hooker
  - Both a prop and a hooker
  - Either a prop or a hooker
  - Any two front-row players
  answers:
  - Loose-head prop, tight-head prop and hooker
  law_reference: '3.8'
  tags:
  - front-row
  - replacement
  law_quote: 'Front-row table (Law 3.8): squad of 23 - must be able to replace loose-head
    prop, tight-head prop and hooker at the first time of asking.'
  explanation: The three positions are distinct - a loose-head cover cannot count
    as tight-head cover.
  contributor: null
- id: L03-017
  text: The match organiser has set squad sizes of 23, but a team can nominate only
    two front-row replacements. How many players may that team have in its squad?
  type: factual
  difficulty: intermediate
  options:
  - '22'
  - '23'
  - '21'
  - '20'
  answers:
  - '22'
  law_reference: '3.9'
  tags:
  - replacement
  - front-row
  law_quote: Where the match organiser has determined squad sizes of 23 and a team
    is able to nominate only two front-row replacements, then that team may nominate
    only 22 players in their squad.
  explanation: The squad shrinks with the front-row cover - you can't keep the 23rd
    player and skip the third front-row replacement.
  contributor: null
- id: L03-018
  text: Before the match, what must each team advise the match officials about their
    front row?
  type: procedural
  difficulty: intermediate
  options:
  - The front-row players and possible replacements, and which positions each can
    play
  - Only the starting front row
  - Only the names of any uncapped front-rowers
  - Nothing - front-row details are checked at the first scrum
  answers:
  - The front-row players and possible replacements, and which positions each can
    play
  law_reference: '3.10'
  tags:
  - front-row
  - referee
  law_quote: Prior to the match, each team must advise the appropriate match official
    of their front-row players and possible front-row replacements and which position(s)
    in the front row they can play.
  explanation: Only those players, in their designated positions, may play in the
    front row when the scrum is contested - get this list before kick-off.
  contributor: null
- id: L03-019
  text: When is a player who is NOT a designated front-row player permitted to play
    in the front row?
  type: factual
  difficulty: advanced
  options:
  - Only when no replacement front-row player is available
  - Never, under any circumstances
  - Whenever the coach nominates them mid-match
  - Only in the final 10 minutes
  answers:
  - Only when no replacement front-row player is available
  law_reference: '3.18'
  tags:
  - front-row
  law_quote: Only when no replacement front-row player is available is any other
    player permitted to play in the front row.
  explanation: This is the last resort - and it is the team's responsibility that
    anyone packing down is suitably trained and experienced (Law 3.12).
  contributor: null
- id: L03-020
  text: A team's designated replacement hooker starts the match at flanker. Is this
    permitted?
  type: factual
  difficulty: intermediate
  options:
  - Yes - a replacement front-row player may start in another position
  - No - designated front-rowers may only play in the front row
  - Only with the match organiser's approval
  - Only if the team has a 23-player squad
  answers:
  - Yes - a replacement front-row player may start in another position
  law_reference: '3.11'
  tags:
  - front-row
  - replacement
  law_quote: A replacement front-row player may start the match in another position.
  explanation: Common at community level - the cover hooker often starts at openside.
    What matters is that they're available to pack down when needed.
  contributor: null
- id: L03-021
  text: When do scrums become uncontested?
  type: factual
  difficulty: intermediate
  options:
  - When a team cannot field a suitably trained front row, or the referee so orders
  - Only when both teams agree
  - Automatically whenever a front-row player is yellow-carded
  - When the score difference exceeds 50 points
  answers:
  - When a team cannot field a suitably trained front row, or the referee so orders
  law_reference: '3.13'
  tags:
  - scrum
  - front-row
  law_quote: Scrums will become uncontested if either team cannot field a suitably
    trained front row or if the referee so orders.
  explanation: A yellow card to a front-rower doesn't automatically mean uncontested
    - the enquiry happens at the next scrum (Law 3.16).
  contributor: null
- id: L03-022
  text: Who may stipulate the conditions under which a game may START with uncontested
    scrums?
  type: factual
  difficulty: intermediate
  options:
  - The match organiser
  - The referee
  - World Rugby only
  - The two head coaches, by agreement
  answers:
  - The match organiser
  law_reference: '3.14'
  tags:
  - scrum
  law_quote: A match organiser may stipulate the conditions under which a game may
    start with uncontested scrums.
  explanation: null
  contributor: null
- id: L03-023
  text: How many players per side must pack down in an uncontested scrum resulting
    from a sending-off, yellow card or injury?
  type: factual
  difficulty: intermediate
  options:
  - '8'
  - '7'
  - '6'
  - '5'
  answers:
  - '8'
  law_reference: '3.15'
  tags:
  - scrum
  - suspension
  - sending-off
  law_quote: Uncontested scrums as a result of a sending off, yellow card or injury
    must be played with eight players per side.
  explanation: The team doesn't gain a loose forward in open play by going uncontested
    - eight must still bind.
  contributor: null
- id: L03-024
  text: A front-row player leaves the field injured. At the next scrum you ask, and
    Red confirm they cannot contest. What do you do?
  type: procedural
  difficulty: intermediate
  options:
  - Order uncontested scrums
  - Ask Red to nominate any player to prop
  - Play the scrum with the position vacant
  - Award a free-kick against Red
  answers:
  - Order uncontested scrums
  law_reference: '3.16'
  tags:
  - scrum
  - front-row
  - referee
  law_quote: When a front-row player leaves the playing area, whether through injury
    or by a yellow or red card, the referee enquires at the next scrum whether the
    team can continue with contested scrums.
  explanation: The enquiry is at the next scrum, not immediately - and if a front-rower
    later returns or comes on, contested scrums may resume.
  contributor: null
- id: L03-025
  text: Uncontested scrums were ordered after a front-row injury. A replacement front-row
    player now comes on. May scrums be contested again?
  type: factual
  difficulty: intermediate
  options:
  - Yes - contested scrums may resume
  - No - once uncontested, always uncontested
  - Only at the start of the next half
  - Only if both captains agree
  answers:
  - Yes - contested scrums may resume
  law_reference: '3.16'
  tags:
  - scrum
  - front-row
  law_quote: If the player returns or another front-row player comes on, then contested
    scrums may resume.
  explanation: null
  contributor: null
- id: L03-026
  text: In a squad of 23, can a player whose departure caused uncontested scrums
    be replaced?
  type: factual
  difficulty: advanced
  options:
  - No - that player cannot be replaced
  - Yes - like any injured player
  - Only by another front-row player
  - Only with the opposition's consent
  answers:
  - No - that player cannot be replaced
  law_reference: '3.17'
  tags:
  - scrum
  - replacement
  law_quote: In a squad of 23 players or at the discretion of the match organiser,
    a player whose departure has caused the referee to order uncontested scrums cannot
    be replaced.
  explanation: This removes any incentive to engineer uncontested scrums - the team
    plays a player short.
  contributor: null
- id: L03-028
  text: Red's loose-head is yellow-carded and Red cannot contest scrums with the
    players on the field. What happens?
  type: scenario
  difficulty: advanced
  options:
  - Red nominate a player to leave so a front-row player can come on; the nominated
    player may not return until the suspension ends
  - Scrums are uncontested for the 10 minutes, no other change
  - Red must play the scrums a player short
  - The yellow card transfers to a front-row replacement
  answers:
  - Red nominate a player to leave so a front-row player can come on; the nominated
    player may not return until the suspension ends
  law_reference: '3.19'
  tags:
  - scrum
  - front-row
  - suspension
  law_quote: If a front-row player is shown a yellow card, and the team cannot continue
    with contested scrums with players already on the field, then the team nominates
    another player to leave the playing area to enable an available front-row player
    to come on. The nominated player may not return until the period of suspension
    ends, or to act as a replacement.
  explanation: The team still pays the numerical price of the card - they lose a
    different player while the front-rower packs down.
  contributor: null
- id: L03-029
  text: Red's tight-head is sent off and Red cannot contest scrums with the players
    on the field. Red nominate a player to leave so a front-rower can come on. May
    the nominated player later return?
  type: scenario
  difficulty: advanced
  options:
  - Yes - the nominated player may act as a replacement
  - No - the nominated player's match is over
  - Only at the start of the second half
  - Only if Red suffer another injury in the front row
  answers:
  - Yes - the nominated player may act as a replacement
  law_reference: '3.20'
  tags:
  - scrum
  - front-row
  - sending-off
  law_quote: If a front-row player is sent off... the team nominates another player
    to leave the playing area to enable an available front-row player to come on.
    The nominated player may act as a replacement.
  explanation: 'Contrast with the yellow-card case (Law 3.19): after a red card
    the nominated player is free to return as a replacement; after a yellow they
    must wait out the suspension.'
  contributor: null
- id: L03-030
  text: A player is replaced due to injury. When may that player return to the match?
  type: factual
  difficulty: beginner
  options:
  - Not at all - an injured player may not return once replaced
  - After 15 minutes if fully recovered
  - At the start of the second half
  - Once a doctor clears them
  answers:
  - Not at all - an injured player may not return once replaced
  law_reference: '3.21'
  tags:
  - injury
  - replacement
  law_quote: A player may be replaced if injured. An injured player may not return
    once replaced.
  explanation: 'Permanent replacement is the default. The exceptions are the temporary
    ones: blood injuries and HIAs, which have their own clocks.'
  contributor: null
- id: L03-031
  text: Under which of these conditions is a player NOT deemed to be injured?
  type: factual
  difficulty: intermediate
  options:
  - It is the opinion of the team captain that it would be inadvisable to continue
  - At national representative level, a doctor considers it inadvisable to continue
  - Where the match organiser permits, a medically trained person considers it inadvisable
    to continue
  - The referee decides (with or without medical advice) it is inadvisable to continue
  answers:
  - It is the opinion of the team captain that it would be inadvisable to continue
  law_reference: '3.22'
  tags:
  - injury
  - referee
  law_quote: The referee decides (with or without medical advice) that it would
    be inadvisable for the player to continue. The referee orders that player to
    leave the playing area.
  explanation: Doctors, medically trained persons (where permitted) and the referee
    can deem a player injured - captains and coaches cannot.
  contributor: null
- id: L03-032
  text: May the referee order an injured player off the field to be medically examined?
  type: factual
  difficulty: beginner
  options:
  - 'Yes'
  - No - only medical staff may order this
  - Only at international level
  - Only with the captain's agreement
  answers:
  - 'Yes'
  law_reference: '3.23'
  tags:
  - injury
  - referee
  law_quote: The referee may also order an injured player to leave the playing area
    to be medically examined.
  explanation: Player welfare overrides play - if in doubt, get them assessed.
  contributor: null
- id: L03-033
  text: What is the process known as "Recognise and Remove"?
  type: procedural
  difficulty: intermediate
  options:
  - Immediate and permanent removal of a player who is concussed or has suspected
    concussion
  - Immediate and permanent removal of a player with a blood injury
  - Immediate and permanent removal of a player who committed foul play
  - Temporary removal of a player for a head injury assessment
  answers:
  - Immediate and permanent removal of a player who is concussed or has suspected
    concussion
  law_reference: '3.24'
  tags:
  - injury
  law_quote: If, at any point during a match, a player is concussed or has suspected
    concussion, that player must be immediately and permanently removed from the
    playing area. This process is known as "Recognise and Remove".
  explanation: This applies at ALL levels of the game. The HIA process (temporary
    replacement) exists only in competitions specifically approved by World Rugby
    - everywhere else, suspected concussion means permanent removal.
  contributor: null
- id: L03-035
  text: A player leaves the field with a blood injury and is temporarily replaced.
    How long do they have to return before the replacement becomes permanent?
  type: factual
  difficulty: intermediate
  options:
  - 15 minutes (actual time)
  - 10 minutes (actual time)
  - 12 minutes (actual time)
  - 20 minutes (playing time)
  answers:
  - 15 minutes (actual time)
  law_reference: '3.25'
  tags:
  - blood-injury
  - replacement
  law_quote: If the player is not available to return to the field of play within
    15 minutes (actual time) of leaving the playing area, the replacement becomes
    permanent.
  explanation: Blood = 15 minutes; HIA = 12 minutes. Both are actual time, not playing
    time.
  contributor: null
- id: L03-036
  text: All of Red's replacements have been used. A Red player now requires an HIA.
    What happens?
  type: scenario
  difficulty: advanced
  options:
  - The player is temporarily replaced anyway - HIA replacement is allowed even
    with all replacements used
  - Red must play on with 14 players
  - The player must stay on until a replacement is freed up
  - The match cannot restart until Red forfeit a different player
  answers:
  - The player is temporarily replaced anyway - HIA replacement is allowed even
    with all replacements used
  law_reference: '3.27'
  tags:
  - injury
  - replacement
  law_quote: A player who requires an HIA... is temporarily replaced (even if all
    the replacements have been used). The game cannot restart until the player who
    requires an HIA has been temporarily replaced.
  explanation: Player welfare replacements don't count against the replacement allowance.
    A temporary replacement can even be temporarily replaced themselves (Law 3.28).
  contributor: null
- id: L03-038
  text: A temporary replacement is sent off. May the originally replaced player return
    to the playing area?
  type: factual
  difficulty: advanced
  options:
  - No, except to comply with Law 3.19 or 3.20 (front-row cover), if medically cleared
    and within the required time
  - Yes, immediately
  - Yes, but only after 10 minutes
  - No, under any circumstances
  answers:
  - No, except to comply with Law 3.19 or 3.20 (front-row cover), if medically cleared
    and within the required time
  law_reference: '3.30'
  tags:
  - replacement
  - sending-off
  law_quote: If a temporary replacement is sent off, the originally replaced player
    is not permitted to return to the playing area, except to comply with Law 3.19
    or 3.20, and only if the player has been medically cleared to do so and does
    so within the required time of leaving the field of play.
  explanation: The two exceptions both relate to restoring a contested front row.
    The same structure applies if the temporary replacement is yellow-carded (Law
    3.31).
  contributor: null
- id: L03-039
  text: The time allowed for a temporary replacement elapses during half-time. What
    happens?
  type: factual
  difficulty: advanced
  options:
  - The replacement becomes permanent unless the replaced player returns immediately
    at the start of the second half
  - The clock pauses and resumes in the second half
  - The replacement automatically becomes permanent
  - The replaced player gets an extra 5 minutes
  answers:
  - The replacement becomes permanent unless the replaced player returns immediately
    at the start of the second half
  law_reference: '3.32'
  tags:
  - replacement
  - half-time
  law_quote: If the time allowed for a temporary replacement elapses during half-time,
    the replacement shall become permanent unless the replaced player returns to
    the field of play immediately at the start of the second half.
  explanation: null
  contributor: null
- id: L03-040
  text: Which of these is NOT a valid reason for a tactically replaced player to
    return to the playing area?
  type: factual
  difficulty: advanced
  options:
  - Returning as captain because the team wants their leadership back on
  - Replacing an injured front-row player
  - Replacing a player with a blood injury
  - Replacing a player injured by verified foul play
  answers:
  - Returning as captain because the team wants their leadership back on
  law_reference: '3.33'
  tags:
  - replacement
  law_quote: 'Tactically replaced players may return to play only when replacing:
    an injured front-row player; a player with a blood injury; a player with a head
    injury; a player who has just been injured as a result of foul play (as verified
    by the match officials); the nominated player described in Law 3.19 or 3.20.'
  explanation: In elite rugby only, a tactically replaced player may also come on
    for a teammate's qualifying red card after 20 minutes of playing time.
