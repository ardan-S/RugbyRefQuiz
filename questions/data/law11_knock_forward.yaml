metadata:
  law: 11
  title: "Knock Forward or Throw Forward"
  source: "World Rugby Laws 2026"

questions:
  - id: L11-001
    text: "Where can a knock forward occur?"
    type: factual
    difficulty: beginner
    options:
      - "Anywhere in the playing area"
      - "Only in the field of play"
      - "Only in open play"
      - "Anywhere except in-goal"
    answers: ["Anywhere in the playing area"]
    law_reference: "11.1"
    tags: ["knock-on"]
    law_quote: "A knock forward may occur anywhere in the playing area."
    explanation: "That includes in-goal - a defender knocking on in their own in-goal creates an attacking 5m scrum."
    contributor: null

  - id: L11-002
    text: "What is the sanction for an unintentional knock forward?"
    type: sanction
    difficulty: beginner
    options:
      - "Scrum to the non-offending team"
      - "Penalty"
      - "Free-kick"
      - "Play on always"
    answers: ["Scrum to the non-offending team"]
    law_reference: "11.1"
    tags: ["knock-on", "sanction"]
    law_quote: "Sanction: Scrum (if the ball goes into touch, the non-offending team may opt instead for a quick-throw or lineout)."
    explanation: "Subject to advantage first - a knock-on is prime advantage material (Law 7)."
    contributor: null

  - id: L11-003
    text: "Red knock on and the ball rolls into touch. What are Blue's options?"
    type: factual
    difficulty: intermediate
    options:
      - "Scrum, quick-throw or lineout"
      - "Scrum only"
      - "Lineout only"
      - "Penalty at the touchline"
    answers: ["Scrum, quick-throw or lineout"]
    law_reference: "11.1"
    tags: ["knock-on", "touch"]
    law_quote: "Sanction: Scrum (if the ball goes into touch, the non-offending team may opt instead for a quick-throw or lineout)."
    explanation: "Offer the choice - the quick-throw option in particular is often missed at community level."
    contributor: null

  - id: L11-004
    text: "Attempting a tackle, Blue 13 gets a hand to the ball and it travels forward off Blue 13's hand to the ground. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Scrum to Red - this is a knock forward by Blue"
      - "Play on - contact in the tackle doesn't count"
      - "Penalty to Red"
      - "Scrum to Blue"
    answers: ["Scrum to Red - this is a knock forward by Blue"]
    law_reference: "11.2"
    tags: ["knock-on", "tackle", "sanction"]
    law_quote: "It is a knock forward when a player, in tackling or attempting to tackle an opponent, makes contact with the ball and the ball goes forward."
    explanation: "The tackler's deflection IS a knock forward - unlike the rip case (Law 11.5b), where the ball goes forward off the BALL-CARRIER's hand."
    contributor: null

  - id: L11-005
    text: "A Red player intentionally knocks the ball forward with a hand. What is the sanction?"
    type: sanction
    difficulty: beginner
    options:
      - "Penalty to Blue"
      - "Scrum to Blue"
      - "Free-kick to Blue"
      - "Play on"
    answers: ["Penalty to Blue"]
    law_reference: "11.3"
    tags: ["knock-on", "intentional", "sanction"]
    law_quote: "A player must not intentionally knock the ball forward with hand or arm. Sanction: Penalty."
    explanation: "If the deliberate knock-forward prevents a probable try, think penalty try; if it kills a clear attacking opportunity, think yellow card."
    contributor: null

  - id: L11-006
    text: "Blue 13 reaches up one-handed at an interception with no realistic chance of catching, and the ball goes forward. What do you award?"
    type: sanction
    difficulty: advanced
    options:
      - "Penalty to Red - an intentional knock forward"
      - "Scrum to Red - a normal knock-on"
      - "Play on - genuine attempt at the ball"
      - "Free-kick to Red"
    answers: ["Penalty to Red - an intentional knock forward"]
    law_reference: "11.4"
    tags: ["knock-on", "intentional", "sanction"]
    law_quote: "It is not an intentional knock forward if, in the act of trying to catch the ball, the player knocks the ball forward provided that there was a reasonable expectation that the player could gain possession."
    explanation: "The test is 'reasonable expectation of gaining possession'. A two-handed catch attempt that spills is a knock-on; a one-handed swat is a penalty."
    contributor: null

  - id: L11-007
    text: "Blue 12 attempts a genuine two-handed interception, gets both hands to the ball, but spills it forward. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Scrum to Red - an unintentional knock forward"
      - "Penalty to Red - all interception knock-ons are intentional"
      - "Play on"
      - "Free-kick to Red"
    answers: ["Scrum to Red - an unintentional knock forward"]
    law_reference: "11.4"
    tags: ["knock-on", "sanction"]
    law_quote: "It is not an intentional knock forward if, in the act of trying to catch the ball, the player knocks the ball forward provided that there was a reasonable expectation that the player could gain possession."
    explanation: "A real catch attempt with a real chance = ordinary knock-on, scrum only."
    contributor: null

  - id: L11-008
    text: "Red 7 charges down Blue 10's kick and the ball goes forward off Red 7's hands. What is the ruling?"
    type: factual
    difficulty: beginner
    options:
      - "Play on - a charge down is not a knock forward"
      - "Scrum to Blue"
      - "Penalty to Blue"
      - "Free-kick to Blue"
    answers: ["Play on - a charge down is not a knock forward"]
    law_reference: "11.5a"
    tags: ["knock-on", "kick"]
    law_quote: "There is no sanction, and play continues, if: a player knocks the ball forward immediately after an opponent has kicked it (charge down)."
    explanation: "'Immediately after' the kick is the test. A charge down also cancels the 10-metre law for the kicking team (Law 10.4c)."
    contributor: null

  - id: L11-009
    text: "Red 6 rips the ball in a tackle and it travels forward off the Blue ball-carrier's arm. What is the ruling?"
    type: factual
    difficulty: intermediate
    options:
      - "Play on - no sanction when the ball goes forward off the opponent's hand or arm in a rip"
      - "Knock forward against Blue - scrum to Red"
      - "Knock forward against Red - scrum to Blue"
      - "Penalty to Blue"
    answers: ["Play on - no sanction when the ball goes forward off the opponent's hand or arm in a rip"]
    law_reference: "11.5b"
    tags: ["knock-on", "rip"]
    law_quote: "There is no sanction, and play continues, if: a player rips or knocks the ball from an opponent and the ball goes forward from the opponent's hand or arm."
    explanation: "The ball going forward off the CARRIER in a legitimate rip is play on - contrast with the tackler deflecting it forward (Law 11.2), which is a knock forward."
    contributor: null

  - id: L11-010
    text: "Where can a throw forward occur?"
    type: factual
    difficulty: beginner
    options:
      - "Anywhere in the playing area"
      - "Only in the field of play"
      - "Only outside the 22s"
      - "Anywhere except in-goal"
    answers: ["Anywhere in the playing area"]
    law_reference: "11.6"
    tags: ["throw-forward"]
    law_quote: "A throw forward may occur anywhere in the playing area. Sanction: Scrum."
    explanation: null
    contributor: null

  - id: L11-011
    text: "What is the sanction for an unintentional throw forward?"
    type: sanction
    difficulty: beginner
    options:
      - "Scrum to the non-offending team"
      - "Penalty"
      - "Free-kick"
      - "Lineout"
    answers: ["Scrum to the non-offending team"]
    law_reference: "11.6"
    tags: ["throw-forward", "sanction"]
    law_quote: "A throw forward may occur anywhere in the playing area. Sanction: Scrum."
    explanation: null
    contributor: null

  - id: L11-012
    text: "A player intentionally throws the ball forward. What is the sanction?"
    type: sanction
    difficulty: beginner
    options:
      - "Penalty"
      - "Scrum"
      - "Free-kick"
      - "Play on"
    answers: ["Penalty"]
    law_reference: "11.7"
    tags: ["throw-forward", "intentional", "sanction"]
    law_quote: "A player must not intentionally throw or pass the ball forward. Sanction: Penalty."
    explanation: null
    contributor: null

  - id: L11-013
    text: "What is the difference in sanction between an intentional and unintentional knock forward?"
    type: factual
    difficulty: intermediate
    options:
      - "Intentional = penalty; unintentional = scrum"
      - "Both are penalties"
      - "Both are scrums"
      - "Intentional = scrum; unintentional = play on"
    answers: ["Intentional = penalty; unintentional = scrum"]
    law_reference: "11.3"
    tags: ["knock-on", "sanction"]
    law_quote: "A knock forward may occur anywhere in the playing area. Sanction: Scrum. ... A player must not intentionally knock the ball forward with hand or arm. Sanction: Penalty."
    explanation: "Intent turns a handling error into an offence - and your read of intent decides which restart you give."
    contributor: null

  - id: L11-014
    text: "Blue 9's arms clearly move backwards in the pass, but wind and momentum carry the ball forward. What is the ruling?"
    type: scenario
    difficulty: advanced
    options:
      - "Play on - a throw forward is judged by the arms moving forward, not the ball's flight"
      - "Scrum to Red - the ball travelled forward"
      - "Penalty to Red - deliberate forward pass"
      - "Free-kick to Red"
    answers: ["Play on - a throw forward is judged by the arms moving forward, not the ball's flight"]
    law_reference: "11.6"
    tags: ["throw-forward"]
    law_quote: "Definitions - Throw forward: When a player throws or passes the ball forward i.e. if the arms of the player passing the ball move forward."
    explanation: "The definition makes the ARMS the test. A ball drifting forward off a backwards passing action - momentum, wind - is not a throw forward."
    contributor: null

  - id: L11-015
    text: "Red 2 deliberately slaps a Blue pass forward to stop the winger catching it. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue, and consider further sanction"
      - "Scrum to Blue"
      - "Free-kick to Blue"
      - "Play on - a legal defensive play"
    answers: ["Penalty to Blue, and consider further sanction"]
    law_reference: "11.3"
    tags: ["knock-on", "intentional", "sanction"]
    law_quote: "A player must not intentionally knock the ball forward with hand or arm. Sanction: Penalty."
    explanation: "If it killed a probable try, this becomes a penalty try; if it killed a clear opportunity, a yellow card."
    contributor: null

  - id: L11-016
    text: "Red 15 fumbles a high ball forward but catches it again before it touches the ground or another player. What is the ruling?"
    type: factual
    difficulty: advanced
    options:
      - "Play on - it is only a knock forward if the ball touches the ground or another player before being recaught"
      - "Knock forward - scrum to Blue"
      - "Play on, but Red 15 may not kick"
      - "Knock forward only if Red 15 is in their own 22"
    answers: ["Play on - it is only a knock forward if the ball touches the ground or another player before being recaught"]
    law_reference: "11.1"
    tags: ["knock-on"]
    law_quote: "Definitions - Knock forward: When a player loses possession of the ball and it goes forward... and the ball touches the ground or another player before the original player can catch it."
    explanation: "The juggle is legal - hold your whistle on a fumbled high ball until it hits the deck or another player."
    contributor: null

  - id: L11-017
    text: "A pass rebounds forward off Red 12's chest to the ground. Red never touched it with hand or arm. What is the ruling?"
    type: factual
    difficulty: advanced
    options:
      - "Play on - a knock forward involves the hand or arm"
      - "Knock forward - scrum to Blue"
      - "Accidental offside - scrum"
      - "Free-kick to Blue"
    answers: ["Play on - a knock forward involves the hand or arm"]
    law_reference: "11.1"
    tags: ["knock-on"]
    law_quote: "Definitions - Knock forward: ...when a player hits the ball forward with the hand or arm, or when the ball hits the hand or arm and goes forward..."
    explanation: "Chest, shoulder, head or leg rebounds are not knock forwards. The common error is whistling a chest-bounce take."
    contributor: null
