metadata:
  law: 7
  title: Advantage
  source: World Rugby Laws 2026
questions:
- id: L07-001
  text: |-
    If a team gains an advantage following an infringement by their opponents, what may the referee do to keep the game flowing?
  type: factual
  difficulty: intermediate
  options:
  - Stop play
  - Award a penalty
  - Allow play to continue
  - Award a free-kick
  answers:
  - Allow play to continue
  law_reference: '7'
  tags:
  - advantage
  - referee
  explanation: null
  contributor: null
- id: L07-002
  text: What types of advantage may be allowed?
  type: factual
  difficulty: intermediate
  options:
  - Tactical
  - Territorial
  - Both tactical and territorial
  - All of the above
  answers:
  - All of the above
  law_reference: '7'
  tags:
  - advantage
  explanation: null
  contributor: null
- id: L07-003
  text: What does a tactical advantage allow?
  type: factual
  difficulty: intermediate
  options:
  - The non-offending team is free to play the ball as they wish
  - Play has moved towards the offending team's dead-ball line
  - A combination of tactical and territorial advantage
  - A mere opportunity to gain an advantage
  answers:
  - The non-offending team is free to play the ball as they wish
  law_reference: '7'
  tags:
  - advantage
  explanation: null
  contributor: null
- id: L07-004
  text: What does a territorial advantage allow?
  type: factual
  difficulty: intermediate
  options:
  - The non-offending team is free to play the ball as they wish
  - Play has moved towards the offending team's dead-ball line
  - A combination of tactical and territorial advantage
  - A mere opportunity to gain an advantage
  answers:
  - Play has moved towards the offending team's dead-ball line
  law_reference: '7'
  tags:
  - advantage
  explanation: null
  contributor: null
- id: L07-005
  text: What must the advantage be in order to be applied?
  type: factual
  difficulty: intermediate
  options:
  - A mere opportunity to gain an advantage
  - Clear and real
  - Only tactical
  - Only territorial
  answers:
  - Clear and real
  law_reference: '7'
  tags:
  - advantage
  explanation: null
  contributor: null
- id: L07-006
  text: When does advantage end?
  type: factual
  difficulty: intermediate
  options:
  - When the referee deems that the non-offending team has gained an advantage
  - |-
    When the referee deems that the non-offending team is unlikely to gain an advantage
  - When the non-offending team commits an infringement before gaining an advantage
  - All of the above
  answers:
  - All of the above
  law_reference: '7'
  tags:
  - advantage
  explanation: null
  contributor: null
- id: L07-007
  text: |-
    What happens if the non-offending team commits an infringement before they have gained an advantage?
  type: scenario
  difficulty: intermediate
  options:
  - The game continues
  - The referee stops the game and applies the sanction for the first infringement
  - The referee allows play to continue
  - The referee awards a try
  answers:
  - The referee stops the game and applies the sanction for the first infringement
  law_reference: '7'
  tags:
  - advantage
  explanation: null
  contributor: null
- id: L07-008
  text: |-
    What happens if the offending team commits a second or subsequent infringement from which no advantage can be gained?
  type: scenario
  difficulty: intermediate
  options:
  - The game continues
  - |-
    The referee allows the captain of the non-offending team to choose the most advantageous sanction
  - The referee sanctions the first infringement
  - The referee sanctions the second infringement
  answers:
  - |-
    The referee allows the captain of the non-offending team to choose the most advantageous sanction
  law_reference: '7'
  tags:
  - advantage
  explanation: null
  contributor: null
- id: L07-009
  text: |-
    When must advantage not be applied and the referee must blow the whistle immediately?
  type: factual
  difficulty: intermediate
  options:
  - |-
    The ball or a player in possession of the ball, touches the referee and an advantage is gained by either side
  - The ball comes out of either end of the tunnel at a scrum
  - A scrum is wheeled through more than 90 degrees
  - All of the above
  answers:
  - All of the above
  law_reference: '7'
  tags:
  - advantage
  - referee
  explanation: null
  contributor: null
- id: L07-010
  text: The ball comes out of either end of the tunnel at a scrum. Sanction?
  type: factual
  difficulty: intermediate
  options:
  - Penalty
  - Free kick
  - Scrum
  - Play advantage
  - Other
  answers:
  - Scrum
  law_reference: '7'
  tags:
  - scrum
  explanation: null
  contributor: null
- id: L07-011
  text: A scrum is wheeled through more than 90 degrees. Can advantage be applied?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'No'
  law_reference: '7'
  tags:
  - scrum
  - advantage
  explanation: null
  contributor: null
- id: L07-012
  text: |-
    A quick throw, free-kick or penalty is taken incorrectly. Can advantage be applied?
  type: sanction
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'No'
  law_reference: '7'
  tags:
  - kick
  - penalty
  - advantage
  explanation: null
  contributor: null
- id: L07-013
  text: Can advantage be applied if it is suspected that a player is injured?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'No'
  law_reference: '7'
  tags:
  - advantage
  explanation: null
  contributor: null
