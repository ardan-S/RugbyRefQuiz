metadata:
  law: 20
  title: "Penalty and Free-Kick"
  source: "World Rugby Laws 2026"

questions:
  - id: L20-001
    text: "What is the purpose of penalties and free-kicks?"
    type: factual
    difficulty: beginner
    options:
      - "To restart play after infringements"
      - "To score points"
      - "To rest the forwards"
      - "To let the referee reset the game"
    answers: ["To restart play after infringements"]
    law_reference: "20"
    tags: ["penalty", "free-kick", "principle"]
    law_quote: "Penalties and free-kicks are awarded to restart play after infringements."
    explanation: "The graduated sanction ladder: free-kick for technical offences, penalty for more serious ones - with the scrum and lineout options attached."
    contributor: null

  - id: L20-002
    text: "How close to the try line may the mark for a penalty or free-kick be?"
    type: factual
    difficulty: intermediate
    options:
      - "No closer than five metres"
      - "No closer than ten metres"
      - "Right up to the try line"
      - "No closer than the 22"
    answers: ["No closer than five metres"]
    law_reference: "20.1"
    tags: ["penalty", "free-kick"]
    law_quote: "The mark for a penalty or free-kick must be in the field of play and be no closer than five metres from the try line."
    explanation: "Both directions - an attacking penalty near the line comes back to 5m out; a defending one moves off the line too."
    contributor: null

  - id: L20-003
    text: "Blue infringe in their own in-goal. Where is Red's penalty?"
    type: factual
    difficulty: intermediate
    options:
      - "In the field of play, five metres from the try line, in line with the infringement"
      - "On the try line"
      - "Where the offence happened, in in-goal"
      - "At the 22-metre line"
    answers: ["In the field of play, five metres from the try line, in line with the infringement"]
    law_reference: "20.1"
    tags: ["penalty", "in-goal"]
    law_quote: "Any infringement in in-goal or within five metres of a try line: In the field of play, five metres from the try line, in line with the place of infringement."
    explanation: "Penalties are never taken in in-goal - they come out to the 5m line. (If the foul play prevented a probable try, a penalty try is the answer instead.)"
    contributor: null

  - id: L20-004
    text: "After you award Red a penalty, a Blue player disputes the decision. What happens to the mark?"
    type: sanction
    difficulty: advanced
    options:
      - "It advances 10 metres from the original mark"
      - "Nothing - dissent only matters once play restarts"
      - "The penalty becomes a penalty try"
      - "A separate second penalty is played after the first"
    answers: ["It advances 10 metres from the original mark"]
    law_reference: "20.1"
    tags: ["penalty", "sanction"]
    law_quote: "Any subsequent infringement by the original offending team after the first penalty or free-kick is awarded but before it is taken: Advanced 10 metres from the original mark."
    explanation: "Any follow-up offence marches the mark - dissent, throwing the ball away, slow retreat. Ten metres can turn a halfway penalty into three points."
    contributor: null

  - id: L20-005
    text: "What may a team awarded a penalty choose instead of kicking?"
    type: factual
    difficulty: beginner
    options:
      - "A scrum"
      - "A drop-out"
      - "A lineout anywhere on the field"
      - "Nothing - a penalty must be kicked"
    answers: ["A scrum"]
    law_reference: "20.3"
    tags: ["penalty"]
    law_quote: "A team awarded a penalty may instead choose a scrum."
    explanation: "The full penalty menu: kick at goal, kick to touch (keeping the throw), tap, or scrum."
    contributor: null

  - id: L20-006
    text: "Red are awarded a PENALTY at a lineout. What are their set-piece options?"
    type: factual
    difficulty: intermediate
    options:
      - "A lineout or a scrum at the same mark"
      - "A scrum only"
      - "A lineout only"
      - "A quick throw only"
    answers: ["A lineout or a scrum at the same mark"]
    law_reference: "20.4a"
    tags: ["penalty", "lineout"]
    law_quote: "A team awarded: a penalty at a lineout may instead choose a lineout or a scrum at the same mark. A free-kick at a lineout may instead choose a lineout at the same mark."
    explanation: "A FREE-KICK at a lineout offers only the lineout option - no scrum. The extra scrum choice is the penalty's privilege."
    contributor: null

  - id: L20-007
    text: "How quickly must a penalty or free-kick be taken?"
    type: factual
    difficulty: beginner
    options:
      - "Without delay"
      - "Within 60 seconds"
      - "Within 90 seconds"
      - "Whenever the kicker is ready"
    answers: ["Without delay"]
    law_reference: "20.5"
    tags: ["penalty", "free-kick"]
    law_quote: "A penalty or free-kick must be taken without delay."
    explanation: "The 60-second clocks apply once a kick AT GOAL is indicated (Law 8.21) - otherwise, without delay."
    contributor: null

  - id: L20-008
    text: "Who may take a penalty or free-kick?"
    type: factual
    difficulty: beginner
    options:
      - "Any player of the non-offending team - except a free-kick for a mark, which the catcher takes"
      - "Only the captain or designated kicker"
      - "Only the scrum-half or fly-half"
      - "Only the player who was fouled"
    answers: ["Any player of the non-offending team - except a free-kick for a mark, which the catcher takes"]
    law_reference: "20.6"
    tags: ["penalty", "free-kick"]
    law_quote: "Any player from the non-offending team may take it, other than for a free-kick awarded for a mark."
    explanation: "The mark is personal to the catcher (Law 17.5) - everything else, anyone may take."
    contributor: null

  - id: L20-009
    text: "What kicks may be used to take a penalty (other than for touch)?"
    type: factual
    difficulty: intermediate
    options:
      - "Punt, drop-kick or place-kick"
      - "Place-kick only"
      - "Drop-kick only"
      - "Tap only"
    answers: ["Punt, drop-kick or place-kick"]
    law_reference: "20.8"
    tags: ["penalty", "kick"]
    law_quote: "The kicker may punt, drop-kick or place-kick (other than for touch) the ball."
    explanation: "The exclusion: you cannot PLACE-kick to touch from a penalty. Punt or drop-kick finds the corner."
    contributor: null

  - id: L20-010
    text: "At a penalty, where must the kicker's team-mates be?"
    type: factual
    difficulty: intermediate
    options:
      - "Behind the ball until it is kicked (except a placer at a place-kick)"
      - "Behind the kicker's original mark"
      - "Within 5 metres of the kicker"
      - "Anywhere onside of the last ruck"
    answers: ["Behind the ball until it is kicked (except a placer at a place-kick)"]
    law_reference: "20.10"
    tags: ["penalty"]
    law_quote: "Other than the placer at a place-kick, the kicker's team must remain behind the ball until it has been kicked."
    explanation: null
    contributor: null

  - id: L20-011
    text: "At a quick tap, the ball barely moves and never clearly leaves the kicker's hands. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Scrum to the opposition"
      - "Penalty retaken"
      - "Play on - close enough"
      - "Free-kick to the opposition"
    answers: ["Scrum to the opposition"]
    law_reference: "20.11"
    tags: ["penalty", "sanction"]
    law_quote: "The ball must be kicked a visible distance. If the kicker is holding it, it must clearly leave the hands. If it is on the ground, it must clearly leave the mark. Once the kick has been successfully taken the kicker may play the ball again. Sanction: Scrum."
    explanation: "Visible distance is the test - and once properly taken, the kicker may immediately regather and go."
    contributor: null

  - id: L20-012
    text: "When Red are awarded a penalty, what must Blue immediately do?"
    type: factual
    difficulty: beginner
    options:
      - "Retreat 10 metres towards their own try line (or to the try line if closer)"
      - "Stand still where they are"
      - "Retreat 5 metres"
      - "Retire behind the ball"
    answers: ["Retreat 10 metres towards their own try line (or to the try line if closer)"]
    law_reference: "20.12"
    tags: ["penalty"]
    law_quote: "When a penalty or free-kick is awarded, the opposing team must immediately retreat 10 metres towards their own try line or until they have reached their try line if that is closer."
    explanation: null
    contributor: null

  - id: L20-013
    text: "Red tap quickly while Blue players are still inside 10 metres. What must those Blue players do?"
    type: factual
    difficulty: intermediate
    options:
      - "Keep retreating the full distance - they may not take part until they have"
      - "Freeze where they are"
      - "They may tackle immediately once the tap is taken"
      - "Walk backwards only if the referee tells them"
    answers: ["Keep retreating the full distance - they may not take part until they have"]
    law_reference: "20.13"
    tags: ["penalty"]
    law_quote: "Even if the penalty or free-kick is taken quickly and the kicker's team is playing the ball, opposing players must keep retreating the necessary distance. They may not take part in the game until they have done so."
    explanation: "A retreating player who intercepts a pass before making 10 metres is a penalty - advanced 10m from the original mark."
    contributor: null

  - id: L20-014
    text: "A Blue player deliberately boots the ball away after you award Red a penalty. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "A second penalty, 10 metres in front of the original mark"
      - "A yellow card, same mark"
      - "A free-kick 10 metres on"
      - "Nothing - manage it verbally"
    answers: ["A second penalty, 10 metres in front of the original mark"]
    law_reference: "20.15"
    tags: ["penalty", "sanction"]
    law_quote: "The opposing team may not do anything to delay the kick or obstruct the kicker, including intentionally taking, throwing or kicking the ball out of reach of the team awarded the penalty. Sanction: Second penalty or free-kick, 10 metres in front of the original mark."
    explanation: "The second kick may not be taken before you have made the new mark. Persistent cynical delays also invite a card."
    contributor: null

  - id: L20-015
    text: "At a FREE-KICK, when may the opposing team charge?"
    type: factual
    difficulty: intermediate
    options:
      - "As soon as the kicker initiates movement to kick"
      - "Never"
      - "Once the ball has been kicked"
      - "After the referee's signal"
    answers: ["As soon as the kicker initiates movement to kick"]
    law_reference: "20.16"
    tags: ["free-kick"]
    law_quote: "As soon as the kicker initiates movement to kick, the opposing team may charge and try to prevent the free-kick being taken by tackling the kicker or to block the kick."
    explanation: "The big penalty/free-kick difference - free-kicks can be charged down; penalties cannot."
    contributor: null

  - id: L20-016
    text: "May the opposing team charge a PENALTY kick?"
    type: factual
    difficulty: beginner
    options:
      - "No - at a penalty the opposition must retreat and may not charge"
      - "Yes, once the kicker moves"
      - "Yes, but only a tap"
      - "Only inside their own 22"
    answers: ["No - at a penalty the opposition must retreat and may not charge"]
    law_reference: "20.16"
    tags: ["penalty"]
    law_quote: "[At a free-kick] As soon as the kicker initiates movement to kick, the opposing team may charge... [No equivalent right exists at a penalty - the opposing team must retreat 10 metres.]"
    explanation: "Charging rights are the free-kick's alone. At a penalty kick at goal, defenders must stand still, hands by their sides (Law 8.22)."
    contributor: null

  - id: L20-017
    text: "Blue charge a Red free-kick fairly and block it before it can be taken. What do you award?"
    type: sanction
    difficulty: advanced
    options:
      - "Scrum at the mark, Blue throwing in"
      - "The free-kick is retaken"
      - "Penalty to Red"
      - "Scrum at the mark, Red throwing in"
    answers: ["Scrum at the mark, Blue throwing in"]
    law_reference: "20.17"
    tags: ["free-kick", "sanction"]
    law_quote: "If the opposing team charge fairly and prevent the free-kick being taken, the kick is disallowed. Play restarts with a scrum at the mark with the opposing team throwing in."
    explanation: "A successful fair charge wins the put-in - a real turnover reward for alert defence."
    contributor: null

  - id: L20-018
    text: "Red are awarded a FREE-KICK at a lineout. What is their set-piece option?"
    type: factual
    difficulty: intermediate
    options:
      - "A lineout at the same mark (no scrum option)"
      - "A lineout or a scrum"
      - "A scrum only"
      - "No option - the free-kick must be tapped"
    answers: ["A lineout at the same mark (no scrum option)"]
    law_reference: "20.4b"
    tags: ["free-kick", "lineout"]
    law_quote: "A team awarded: a free-kick at a lineout may instead choose a lineout at the same mark."
    explanation: null
    contributor: null

  - id: L20-019
    text: "Blue infringe in a lineout. Where is Red's penalty marked?"
    type: factual
    difficulty: intermediate
    options:
      - "15 metres from the touchline, on the mark of touch"
      - "Where the offence occurred in the lineout"
      - "5 metres in from touch"
      - "At the front of the lineout"
    answers: ["15 metres from the touchline, on the mark of touch"]
    law_reference: "20.1"
    tags: ["penalty", "lineout"]
    law_quote: "Any infringement in a lineout: 15 metres from the touchline on the mark of touch."
    explanation: "Always 15m in - giving the kicker a workable angle regardless of where in the lineout the offence happened."
    contributor: null

  - id: L20-020
    text: "A penalty is taken from the wrong place. What happens?"
    type: sanction
    difficulty: intermediate
    options:
      - "It must be retaken from the correct mark"
      - "Play on if no advantage accrued"
      - "Scrum to the opposition"
      - "The penalty is reversed"
    answers: ["It must be retaken from the correct mark"]
    law_reference: "20.2"
    tags: ["penalty", "sanction"]
    law_quote: "When a penalty or free-kick is taken at the wrong place, it must be re-taken."
    explanation: "And remember - no advantage can be played on an incorrectly taken penalty or free-kick (Law 7.3e); whistle immediately."
    contributor: null

  - id: L20-021
    text: "From where may the kicker actually take the penalty?"
    type: factual
    difficulty: intermediate
    options:
      - "At the mark, or anywhere behind it on a line through the mark parallel to the touchlines"
      - "Only exactly at the mark"
      - "Anywhere within 5 metres of the mark"
      - "Anywhere behind the mark, at any angle"
    answers: ["At the mark, or anywhere behind it on a line through the mark parallel to the touchlines"]
    law_reference: "20.2"
    tags: ["penalty"]
    law_quote: "A penalty or free-kick is taken from where it is awarded or anywhere behind it on a line through the mark and parallel to the touchlines."
    explanation: "Straight back only - the kicker can retreat for a better angle at goal but cannot walk sideways."
    contributor: null

  - id: L20-022
    text: "Blue are offside at a phase of play. Where is Red's penalty marked?"
    type: factual
    difficulty: advanced
    options:
      - "At Blue's offside line"
      - "Where the offside player stood"
      - "Where the ball was at the time"
      - "10 metres behind the offence"
    answers: ["At Blue's offside line"]
    law_reference: "20.1"
    tags: ["penalty", "offside"]
    law_quote: "Offside at a phase of play: At the offending team's offside line."
    explanation: "The mark is the LINE they should have been behind, not where the offender stood - often a material difference near the ruck."
    contributor: null

  - id: L20-023
    text: "Red 10 is charged late after kicking. What is the penalty placement menu?"
    type: sanction
    difficulty: advanced
    options:
      - "Red choose: the place of the offence, where the ball landed, or where it was next played"
      - "Only the place of the offence"
      - "Always where the ball landed"
      - "Half-way between offence and landing"
    answers: ["Red choose: the place of the offence, where the ball landed, or where it was next played"]
    law_reference: "20.1"
    tags: ["penalty", "late-tackle"]
    law_quote: "Late charging the kicker: The opposition chooses either at the place of the infringement, where the ball landed or where the ball was next played."
    explanation: "Plus the special cases - ball into touch: 15m line in line with where it went out; into in-goal or dead: 5m from the try line, at least 15m in (Law 20.1 table; see also Law 9.25)."
    contributor: null

  - id: L20-024
    text: "Which ball must be used to take a penalty?"
    type: factual
    difficulty: intermediate
    options:
      - "The ball that was in play, unless the referee decides it is defective"
      - "Any ball the kicker prefers"
      - "A fresh ball from the ball boys"
      - "The captain's choice of ball"
    answers: ["The ball that was in play, unless the referee decides it is defective"]
    law_reference: "20.7"
    tags: ["penalty"]
    law_quote: "The kicker must use the ball that was in play unless the referee decides it is defective."
    explanation: "Watch for the swap to a fresh, dry ball for the shot at goal - not allowed unless the match ball is defective."
    contributor: null

  - id: L20-025
    text: "Red tap so fast that nearby Blue players genuinely had no chance to retreat. Are those Blue players sanctioned?"
    type: factual
    difficulty: advanced
    options:
      - "No - but they may not take part until they retreat 10m, or an onside team-mate overtakes them"
      - "Yes - automatic penalty 10m on"
      - "No, and they may play immediately"
      - "Yes - free-kick against them"
    answers: ["No - but they may not take part until they retreat 10m, or an onside team-mate overtakes them"]
    law_reference: "20.14"
    tags: ["penalty"]
    law_quote: "If it is taken so quickly that opponents have no opportunity to retreat, they will not be sanctioned for this. However, they may not take part in the game until they have retreated 10 metres from the mark or until a team-mate who was 10 metres from the mark has moved in front of them."
    explanation: "The team-mate route back onside is the detail most refs miss - a retreating team-mate coming from an onside position puts them back in the game."
    contributor: null

  - id: L20-026
    text: "An offence occurs while the ball is DEAD, where play would have restarted with a lineout 8 metres in from touch. Where is the penalty marked?"
    type: sanction
    difficulty: advanced
    options:
      - "On the 15-metre line, in line with where play would have restarted"
      - "Where play would have restarted, 8m in"
      - "At the place of the offence"
      - "Centre of the field on the restart line"
    answers: ["On the 15-metre line, in line with where play would have restarted"]
    law_reference: "20.1"
    tags: ["penalty"]
    law_quote: "While the ball is dead: At the point where play would have restarted or, if that place is on the touchline or within 15 metres of it, the mark is on the 15-metre line, in line with that place."
    explanation: "Dead-ball flashpoints (Law 9.6) restart where play would have - pulled to the 15m line when that spot is too close to touch. If the restart would have been a drop-out, the non-offending team picks anywhere on the sanction line."
    contributor: null
