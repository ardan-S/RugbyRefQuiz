metadata:
  law: 13
  title: "Players on the Ground in Open Play"
  source: "World Rugby Laws 2026"

questions:
  - id: L13-001
    text: "What is the principle of Law 13?"
    type: factual
    difficulty: beginner
    options:
      - "The game is played only by players who are on their feet"
      - "Players must stay down once tackled"
      - "The ball may be played from any position"
      - "Only the tackler may play a grounded ball"
    answers: ["The game is played only by players who are on their feet"]
    law_reference: "13"
    tags: ["principle"]
    law_quote: "The game is played only by players who are on their feet."
    explanation: "This principle underpins the tackle, ruck and maul laws too - being on your feet is the price of participation."
    contributor: null

  - id: L13-002
    text: "Red 4 goes to ground gathering a loose ball in open play. What must Red 4 do immediately?"
    type: factual
    difficulty: beginner
    options:
      - "Get up with the ball, play (not kick) it, or release it"
      - "Hold the ball and wait for support"
      - "Place the ball backwards and stay down"
      - "Roll towards their own team"
    answers: ["Get up with the ball, play (not kick) it, or release it"]
    law_reference: "13.1"
    tags: ["on-feet"]
    law_quote: "Players, who go to ground to gather the ball or who go to ground with the ball, must immediately: get up with the ball; or play (but not kick) the ball; or release the ball. Sanction: Penalty."
    explanation: "'Immediately' is the word to referee - no pause to assess, no waiting for team-mates."
    contributor: null

  - id: L13-003
    text: "May a player on the ground kick the ball?"
    type: factual
    difficulty: intermediate
    options:
      - "No - a player on the ground may play the ball but not kick it"
      - "Yes, in any direction"
      - "Only to clear it into touch"
      - "Only in their own in-goal"
    answers: ["No - a player on the ground may play the ball but not kick it"]
    law_reference: "13.1"
    tags: ["on-feet", "kick"]
    law_quote: "Play (but not kick) the ball."
    explanation: "The panicked fly-hack from the floor is a penalty - passing or releasing from the ground is fine, kicking is not."
    contributor: null

  - id: L13-004
    text: "Red 6 goes to ground with the ball and holds on without getting up, playing or releasing. What do you award?"
    type: sanction
    difficulty: beginner
    options:
      - "Penalty to Blue"
      - "Free-kick to Blue"
      - "Scrum to Blue"
      - "Play on until a ruck forms"
    answers: ["Penalty to Blue"]
    law_reference: "13.1"
    tags: ["on-feet", "sanction"]
    law_quote: "Players, who go to ground to gather the ball or who go to ground with the ball, must immediately: get up with the ball; or play (but not kick) the ball; or release the ball. Sanction: Penalty."
    explanation: "This is open play - no tackler is needed for the obligation to exist."
    contributor: null

  - id: L13-005
    text: "The ball has been played away. What must players on the ground immediately do?"
    type: factual
    difficulty: intermediate
    options:
      - "Move away from the ball, or get up"
      - "Stay still so they don't interfere"
      - "Roll towards their own side"
      - "Wait for the referee's instruction"
    answers: ["Move away from the ball, or get up"]
    law_reference: "13.2"
    tags: ["on-feet"]
    law_quote: "Once the ball is played or released, players on the ground must immediately either move away from the ball or get up. Sanction: Penalty."
    explanation: "Lying near the ball is obstruction by another name - bodies on the floor slow the game and invite penalties."
    contributor: null

  - id: L13-006
    text: "After releasing the ball, Blue 7 stays lying next to it as Red arrive. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Red"
      - "Free-kick to Red"
      - "Scrum to Red"
      - "Play on - Blue 7 released"
    answers: ["Penalty to Red"]
    law_reference: "13.2"
    tags: ["on-feet", "sanction"]
    law_quote: "Once the ball is played or released, players on the ground must immediately either move away from the ball or get up. Sanction: Penalty."
    explanation: "Releasing is only half the job - the player must then clear the space."
    contributor: null

  - id: L13-007
    text: "How does the law describe a player on the ground, in the field of play, without the ball?"
    type: factual
    difficulty: intermediate
    options:
      - "Out of the game"
      - "Offside"
      - "A ruck participant"
      - "Still in play if they arrived legally"
    answers: ["Out of the game"]
    law_reference: "13.3"
    tags: ["on-feet"]
    law_quote: "A player on the ground, in the field of play, without the ball is out of the game and must: allow opponents who are not on the ground to play or gain possession of the ball; not play the ball; not tackle or attempt to tackle an opponent. Sanction: Penalty."
    explanation: "'Out of the game' - three obligations follow: let opponents play, don't play the ball, don't tackle."
    contributor: null

  - id: L13-008
    text: "Lying on the ground without the ball, Red 5 taps the loose ball back to a team-mate. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue"
      - "Free-kick to Blue"
      - "Scrum to Blue"
      - "Play on - the ball was loose"
    answers: ["Penalty to Blue"]
    law_reference: "13.3"
    tags: ["on-feet", "sanction"]
    law_quote: "[A player on the ground without the ball] must... not play the ball."
    explanation: "Playing the ball from the floor without possession is the classic 'hands in from the ground' picture in open play."
    contributor: null

  - id: L13-009
    text: "From the ground, Blue 6 grabs the legs of the Red ball-carrier running past. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Red"
      - "Play on - a fine tap tackle"
      - "Scrum to Red"
      - "Free-kick to Red"
    answers: ["Penalty to Red"]
    law_reference: "13.3"
    tags: ["on-feet", "tackle", "sanction"]
    law_quote: "[A player on the ground without the ball] must... not tackle or attempt to tackle an opponent."
    explanation: "A tap tackle is legal only from a player on their feet (diving counts as leaving their feet TO tackle) - a player already lying on the ground cannot tackle at all."
    contributor: null

  - id: L13-010
    text: "What must a player on the ground without the ball allow?"
    type: factual
    difficulty: intermediate
    options:
      - "Opponents who are on their feet to play or gain possession of the ball"
      - "Only their own team to play the ball"
      - "The scrum-half to dig the ball out"
      - "Nothing - they have no obligations"
    answers: ["Opponents who are on their feet to play or gain possession of the ball"]
    law_reference: "13.3"
    tags: ["on-feet"]
    law_quote: "Allow opponents who are not on the ground to play or gain possession of the ball."
    explanation: "Shielding the ball from the floor - even passively - denies opponents this right."
    contributor: null

  - id: L13-011
    text: "Red 12, on their feet without the ball, deliberately falls on Blue 9 who is on the ground with the ball. What do you award?"
    type: sanction
    difficulty: beginner
    options:
      - "Penalty to Blue"
      - "Free-kick to Blue"
      - "Scrum to Blue"
      - "Play on - contact is inevitable"
    answers: ["Penalty to Blue"]
    law_reference: "13.4"
    tags: ["on-feet", "sanction"]
    law_quote: "Players on their feet and without the ball must not fall on or over players on the ground who have the ball or who are near it. Sanction: Penalty."
    explanation: "Killing the ball by flopping - a penalty, and if it prevents quick attacking ball repeatedly, think cards."
    contributor: null

  - id: L13-012
    text: "Blue 3 dives over two grounded players lying NEAR the loose ball, without touching the ball. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Red - falling over players near the ball is an offence"
      - "Play on - Blue 3 never touched the ball"
      - "Scrum to Red"
      - "Free-kick to Red"
    answers: ["Penalty to Red - falling over players near the ball is an offence"]
    law_reference: "13.4"
    tags: ["on-feet", "sanction"]
    law_quote: "Players on their feet and without the ball must not fall on or over players on the ground who have the ball or who are near it."
    explanation: "'Or who are near it' - the offence doesn't require contact with the ball, just the dangerous, ball-killing dive."
    contributor: null

  - id: L13-013
    text: "Blue 7 is on the ground without the ball. As Red 9 reaches to pick up the ball, Blue 7 grabs Red 9's arm. What do you award?"
    type: scenario
    difficulty: intermediate
    options:
      - "Penalty to Red - a player on the ground is out of the game and must not interfere"
      - "Play on - a fair contest for the ball"
      - "Scrum to Red"
      - "Free-kick to Red"
    answers: ["Penalty to Red - a player on the ground is out of the game and must not interfere"]
    law_reference: "13.3"
    tags: ["on-feet", "sanction"]
    law_quote: "A player on the ground, in the field of play, without the ball is out of the game and must: allow opponents who are not on the ground to play or gain possession of the ball... not tackle or attempt to tackle an opponent."
    explanation: "Interfering from the floor at the base of a breakdown is one of the most common unseen offences - get your eyes low."
    contributor: null

  - id: L13-014
    text: "Red 11 dives on a loose ball in open play and gathers it. What must Red 11 do next?"
    type: factual
    difficulty: beginner
    options:
      - "Immediately get up with the ball, play it, or release it"
      - "Hold it on the floor until team-mates arrive to ruck"
      - "Place it back and stand up"
      - "Nothing - diving on a loose ball ends the obligation"
    answers: ["Immediately get up with the ball, play it, or release it"]
    law_reference: "13.1"
    tags: ["on-feet"]
    law_quote: "Players, who go to ground to gather the ball or who go to ground with the ball, must immediately: get up with the ball; or play (but not kick) the ball; or release the ball."
    explanation: "Diving on the ball is legal - camping on it is not. Allow a beat for the player to comply, then penalise."
    contributor: null
