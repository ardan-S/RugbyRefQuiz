metadata:
  law: 19
  title: "Scrum"
  source: "World Rugby Laws 2026"

questions:
  - id: L19-001
    text: "What is the purpose of a scrum?"
    type: factual
    difficulty: beginner
    options:
      - "To restart play with a contest for possession after a minor infringement or stoppage"
      - "To award possession to the non-offending team"
      - "To give forwards a rest point"
      - "To punish handling errors"
    answers: ["To restart play with a contest for possession after a minor infringement or stoppage"]
    law_reference: "19"
    tags: ["scrum", "principle"]
    law_quote: "The purpose of a scrum is to restart play with a contest for possession after a minor infringement or stoppage."
    explanation: "A CONTEST - which is why so much scrum law protects the fairness of the put-in, the strike and the push."
    contributor: null

  - id: L19-002
    text: "How long do teams have to be ready to form the scrum once the mark is made?"
    type: factual
    difficulty: intermediate
    options:
      - "30 seconds"
      - "15 seconds"
      - "60 seconds"
      - "No limit while injuries are treated"
    answers: ["30 seconds"]
    law_reference: "19.4"
    tags: ["scrum"]
    law_quote: "Teams must be ready to form the scrum within 30 seconds of the mark being made. Sanction: Free-kick."
    explanation: "Sevens halves this to 15 seconds."
    contributor: null

  - id: L19-003
    text: "Red are still ambling to the mark 40 seconds after you made it. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Free-kick to Blue"
      - "Penalty to Blue"
      - "Nothing - scrums take time"
      - "Scrum with Blue's put-in"
    answers: ["Free-kick to Blue"]
    law_reference: "19.4"
    tags: ["scrum", "sanction"]
    law_quote: "Teams must be ready to form the scrum within 30 seconds of the mark being made. Sanction: Free-kick."
    explanation: null
    contributor: null

  - id: L19-004
    text: "With both teams at 15 players, how many bind into the scrum from each side?"
    type: factual
    difficulty: beginner
    options:
      - "Eight - two props and a hooker, two locks, and three back-row players"
      - "Seven, with the number 8 optional"
      - "As many as each team chooses"
      - "Eight, in any positional arrangement"
    answers: ["Eight - two props and a hooker, two locks, and three back-row players"]
    law_reference: "19.5"
    tags: ["scrum", "front-row"]
    law_quote: "When both teams have 15 players, eight players from each team bind together in formation as outlined in the diagram. Each team must have two props and one hooker in the front row and two locks in the second row. Three back-row players from each team complete the scrum. Sanction: Penalty."
    explanation: "The formation is prescribed - eight players AND the right shape."
    contributor: null

  - id: L19-005
    text: "What is the minimum number of players a team may have in a scrum?"
    type: factual
    difficulty: intermediate
    options:
      - "Five"
      - "Six"
      - "Three"
      - "Eight - it can never reduce"
    answers: ["Five"]
    law_reference: "19.6"
    tags: ["scrum"]
    law_quote: "When a team is reduced to fewer than 15 for any reason, then the number of players in each team in the scrum may be similarly reduced... However, a team must not have fewer than five players in the scrum."
    explanation: "If one team legally reduces, the other is NOT required to match."
    contributor: null

  - id: L19-006
    text: "What is the referee's engagement call sequence?"
    type: factual
    difficulty: beginner
    options:
      - "Crouch - Bind - Set"
      - "Crouch - Touch - Set"
      - "Crouch - Touch - Pause - Engage"
      - "Bind - Crouch - Set"
    answers: ["Crouch - Bind - Set"]
    law_reference: "19.10"
    tags: ["scrum"]
    law_quote: "When both sides are square, stable and stationary, the referee calls 'crouch'... the referee calls 'bind'... the referee calls 'set'."
    explanation: "Each call waits for square, stable and stationary - you own the tempo, not the front rows."
    contributor: null

  - id: L19-007
    text: "What body position must front-rows hold from the crouch, for the duration of the scrum?"
    type: factual
    difficulty: intermediate
    options:
      - "Heads and shoulders no lower than their hips"
      - "Backs at 45 degrees"
      - "Heads below their opponents'"
      - "Any position once engaged"
    answers: ["Heads and shoulders no lower than their hips"]
    law_reference: "19.10a"
    tags: ["scrum", "body-position"]
    law_quote: "The front-rows then adopt a crouched position... Their heads and shoulders are no lower than their hips, a position that is maintained for the duration of the scrum. Sanction: Free-kick."
    explanation: null
    contributor: null

  - id: L19-008
    text: "What is the hooker's 'brake foot'?"
    type: factual
    difficulty: advanced
    options:
      - "A foot positioned forward before engagement to aid stability and avoid axial loading"
      - "The foot the hooker strikes with"
      - "A prop technique to stop the drive"
      - "The number 8's controlling foot"
    answers: ["A foot positioned forward before engagement to aid stability and avoid axial loading"]
    law_reference: "19.10c"
    tags: ["scrum", "front-row"]
    law_quote: "Hookers must have a 'brake' foot positioned to help stability and to avoid axial loading. Sanction: Free-kick."
    explanation: "The brake foot stays on until 'set' - only then may the hooker remove it as the teams engage (Law 19.12a)."
    contributor: null

  - id: L19-009
    text: "Who chooses which side of the scrum the ball is thrown in from?"
    type: factual
    difficulty: beginner
    options:
      - "The scrum-half"
      - "The referee"
      - "The captain"
      - "It must always be the loose-head side"
    answers: ["The scrum-half"]
    law_reference: "19.13"
    tags: ["scrum"]
    law_quote: "The scrum-half chooses which side of the scrum to throw in the ball."
    explanation: "In practice nearly always their loose-head side, but it is the 9's choice in law."
    contributor: null

  - id: L19-010
    text: "The scrum-half feeds the ball crookedly into the second row's feet. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Free-kick to the opposition"
      - "Penalty to the opposition"
      - "Reset the scrum"
      - "Play on - feeds are never straight"
    answers: ["Free-kick to the opposition"]
    law_reference: "19.15"
    tags: ["scrum", "sanction"]
    law_quote: "The scrum-half throws in the ball... straight. The scrum-half may align their shoulder on the middle line of the scrum, thereby standing a shoulder-width closer to their side of the scrum. Sanction: Free-kick."
    explanation: "The shoulder-width allowance means a slightly favourable feed is legal - but the ball must still land in the tunnel."
    contributor: null

  - id: L19-011
    text: "When does the scrum begin?"
    type: factual
    difficulty: intermediate
    options:
      - "When the ball leaves the scrum-half's hands"
      - "On the referee's 'set' call"
      - "When the front rows engage"
      - "When the hooker strikes"
    answers: ["When the ball leaves the scrum-half's hands"]
    law_reference: "19.16"
    tags: ["scrum"]
    law_quote: "The scrum begins when the ball leaves the hands of the scrum-half."
    explanation: "This moment matters - pushing before it is a free-kick (Law 19.17)."
    contributor: null

  - id: L19-012
    text: "Blue shove early, before the ball is thrown in. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Free-kick to Red"
      - "Penalty to Red"
      - "Reset with no sanction"
      - "Play on if the scrum stays up"
    answers: ["Free-kick to Red"]
    law_reference: "19.17"
    tags: ["scrum", "sanction"]
    law_quote: "Only when the scrum begins may the teams push. Sanction: Free-kick."
    explanation: null
    contributor: null

  - id: L19-013
    text: "In what direction may players push in a scrum?"
    type: factual
    difficulty: intermediate
    options:
      - "Straight and parallel to the ground"
      - "In any direction that stays bound"
      - "Slightly inwards to wheel"
      - "Upwards to pop the opponent"
    answers: ["Straight and parallel to the ground"]
    law_reference: "19.19"
    tags: ["scrum"]
    law_quote: "Players may push provided they do so straight and parallel to the ground. Sanction: Penalty."
    explanation: "Angled or upward pressure is a PENALTY - it destabilises opponents dangerously."
    contributor: null

  - id: L19-014
    text: "When may the front rows strike for the ball?"
    type: factual
    difficulty: intermediate
    options:
      - "Only once the ball touches the ground in the tunnel"
      - "As soon as it leaves the 9's hands"
      - "On the referee's signal"
      - "Any time after 'set'"
    answers: ["Only once the ball touches the ground in the tunnel"]
    law_reference: "19.20"
    tags: ["scrum", "front-row"]
    law_quote: "Front-row players may gain possession by striking for the ball but only once the ball touches the ground in the tunnel. Sanction: Free-kick."
    explanation: "Striking at a ball still in flight ('foot up') is the free-kick."
    contributor: null

  - id: L19-015
    text: "A hooker strikes for the ball with both feet at once. What do you award?"
    type: sanction
    difficulty: advanced
    options:
      - "Penalty to the opposition"
      - "Free-kick to the opposition"
      - "Reset the scrum"
      - "Play on - any strike is legal"
    answers: ["Penalty to the opposition"]
    law_reference: "19.21"
    tags: ["scrum", "front-row", "sanction"]
    law_quote: "A front-row player striking for the ball may do so with either foot but not both at the same time. Sanction: Penalty."
    explanation: "Both feet off the ground means the hooker is swinging on the props - a safety penalty, not a technical free-kick."
    contributor: null

  - id: L19-016
    text: "The throwing team's hooker makes no attempt to strike, letting the shove do the work. What do you award?"
    type: sanction
    difficulty: advanced
    options:
      - "Free-kick to the opposition"
      - "Penalty to the opposition"
      - "Nothing - striking is optional"
      - "Reset the scrum"
    answers: ["Free-kick to the opposition"]
    law_reference: "19.22"
    tags: ["scrum", "front-row", "sanction"]
    law_quote: "The hooker from the team which threw in the ball must strike for the ball. Sanction: Free-kick."
    explanation: "The throwing hooker MUST strike - the eight-man shove over a dead ball is a free-kick offence."
    contributor: null

  - id: L19-017
    text: "The scrum is stationary with the ball at the number 8's feet. When do you call 'use it'?"
    type: procedural
    difficulty: advanced
    options:
      - "After the ball has been available for three to five seconds"
      - "Immediately"
      - "After ten seconds"
      - "Never - the team may hold it indefinitely"
    answers: ["After the ball has been available for three to five seconds"]
    law_reference: "19.26"
    tags: ["scrum", "use-it"]
    law_quote: "When the scrum is stationary and the ball has been available at the back of the scrum for three-five seconds, the referee calls 'use it'. The team must then play the ball out of the scrum immediately. Sanction: Scrum."
    explanation: "Note 'immediately' here - stricter than the ruck's five seconds after the call."
    contributor: null

  - id: L19-018
    text: "You call 'use it' at the scrum and Red hold the ball in. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Scrum to Blue"
      - "Free-kick to Blue"
      - "Penalty to Blue"
      - "Another warning"
    answers: ["Scrum to Blue"]
    law_reference: "19.26"
    tags: ["scrum", "use-it", "sanction"]
    law_quote: "The team must then play the ball out of the scrum immediately. Sanction: Scrum."
    explanation: "Turnover scrum - failure to use it hands over the feed (Law 19.1 table)."
    contributor: null

  - id: L19-019
    text: "Where must players not participating in the scrum stand?"
    type: factual
    difficulty: intermediate
    options:
      - "At least 5 metres behind the hindmost foot of their team"
      - "At least 10 metres back"
      - "Level with the hindmost foot"
      - "Behind the ball"
    answers: ["At least 5 metres behind the hindmost foot of their team"]
    law_reference: "19.31"
    tags: ["scrum", "offside"]
    law_quote: "All players not participating at the scrum remain at least five metres behind the hindmost foot of their team. Sanction: Penalty."
    explanation: "The backline offside line - and creeping inside it is a penalty, not a free-kick."
    contributor: null

  - id: L19-020
    text: "With no infringement, the scrum wheels through more than 90 degrees. What do you do?"
    type: procedural
    difficulty: intermediate
    options:
      - "Stop play and reset the scrum - the same team throws in again"
      - "Award the put-in to the other team"
      - "Penalty against the wheeling team"
      - "Play on until the ball emerges"
    answers: ["Stop play and reset the scrum - the same team throws in again"]
    law_reference: "19.34c"
    tags: ["scrum"]
    law_quote: "When there is no infringement, the referee will stop play and reset the scrum if: the scrum is wheeled through more than 90 degrees, so the middle line has passed beyond a position parallel to the touchline. When a scrum is reset, the ball is thrown in by the team that previously threw it in."
    explanation: "No turnover for a wheel any more - reset, same feed. An INTENTIONAL wheel is different: dangerous play analysis applies."
    contributor: null

  - id: L19-021
    text: "Which of these does NOT end the scrum?"
    type: factual
    difficulty: intermediate
    options:
      - "The ball emerging from the tunnel"
      - "The ball coming out of the scrum anywhere except the tunnel"
      - "The hindmost player picking the ball up from their feet"
      - "The ball in the scrum reaching the try line"
    answers: ["The ball emerging from the tunnel"]
    law_reference: "19.36"
    tags: ["scrum"]
    law_quote: "The scrum ends: when the ball comes out of the scrum in any direction except the tunnel; when the ball reaches the feet of the hindmost player and it is picked up by that player or is played by that team's scrum-half; when the number eight picks up the ball from the feet of a second-row player; when the referee blows the whistle for an infringement; when the ball in a scrum is on or over the try line."
    explanation: "Out of the tunnel = reset, not ended (Law 19.34a). The number 8 picking from the locks' feet is a legal early pick."
    contributor: null

  - id: L19-022
    text: "A prop intentionally collapses the scrum. What do you award?"
    type: sanction
    difficulty: beginner
    options:
      - "Penalty (with a card to consider)"
      - "Free-kick"
      - "Reset only"
      - "Scrum turnover"
    answers: ["Penalty (with a card to consider)"]
    law_reference: "19.37d"
    tags: ["scrum", "collapse", "sanction"]
    law_quote: "Dangerous play in a scrum includes: ...intentionally collapsing a scrum... Sanction: Penalty."
    explanation: "Whenever a scrum collapses or a player pops upward, whistle IMMEDIATELY so pushing stops (Law 19.25) - safety first, sanction second."
    contributor: null

  - id: L19-023
    text: "The scrum-half hacks the ball while it is still in the scrum. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to the opposition"
      - "Free-kick to the opposition"
      - "Play on"
      - "Reset the scrum"
    answers: ["Penalty to the opposition"]
    law_reference: "19.38b"
    tags: ["scrum", "sanction"]
    law_quote: "Other restricted practices at a scrum include: ...scrum-half kicking the ball while it is in the scrum... Sanction: Penalty."
    explanation: null
    contributor: null

  - id: L19-024
    text: "The scrum-half fakes lifting the ball to make Blue's back row believe it is out. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Free-kick to Blue"
      - "Penalty to Blue"
      - "Play on - fair gamesmanship"
      - "Reset the scrum"
    answers: ["Free-kick to Blue"]
    law_reference: "19.38f"
    tags: ["scrum", "sanction"]
    law_quote: "Scrum-half attempting to make an opponent believe the ball is out of the scrum when it is not. Sanction: Free-kick."
    explanation: "Same free-kick deception family as at ruck and maul."
    contributor: null

  - id: L19-025
    text: "Red knock on in open play. Who throws in at the scrum?"
    type: factual
    difficulty: beginner
    options:
      - "Blue - the non-offending team"
      - "Red - possession stays"
      - "The team going forward"
      - "The attacking team"
    answers: ["Blue - the non-offending team"]
    law_reference: "19.1"
    tags: ["scrum", "knock-on"]
    law_quote: "A knock forward or throw forward, apart from at a lineout... Who throws in: The non-offending team."
    explanation: "Location: the scrum zone at the point closest to the infringement."
    contributor: null

  - id: L19-026
    text: "A ruck is unplayable with neither team clearly at fault. Who throws in at the scrum?"
    type: factual
    difficulty: advanced
    options:
      - "The team last moving forward; if neither, the attacking team"
      - "The team that took the ball into the ruck"
      - "The defending team"
      - "Decided by coin toss"
    answers: ["The team last moving forward; if neither, the attacking team"]
    law_reference: "19.1"
    tags: ["scrum", "ruck"]
    law_quote: "An unplayable tackle or ruck... Who throws in: The team last moving forward. If neither team was moving forward, the attacking team."
    explanation: null
    contributor: null

  - id: L19-027
    text: "A maul ends unsuccessfully. Who throws in at the scrum?"
    type: factual
    difficulty: advanced
    options:
      - "The team NOT in possession at the start of the maul"
      - "The team in possession at the start"
      - "Always the attacking team"
      - "The team that stopped the maul"
    answers: ["The team NOT in possession at the start of the maul"]
    law_reference: "19.1"
    tags: ["scrum", "maul"]
    law_quote: "A maul that ends unsuccessfully... Who throws in: The team not in possession at the start of the maul. If the referee cannot decide which team had possession, the team moving forward before the maul stopped. If neither team was moving forward, the attacking team."
    explanation: "The maul turnover - with the kick-catch exception giving the scrum to the catcher's team (Law 16.19)."
    contributor: null

  - id: L19-028
    text: "The ball pops out of the scrum and a Red flanker pushes it straight back in. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Free-kick to Blue"
      - "Penalty to Blue"
      - "Play on"
      - "Reset the scrum"
    answers: ["Free-kick to Blue"]
    law_reference: "19.38d"
    tags: ["scrum", "sanction"]
    law_quote: "Other restricted practices at a scrum include: ...bringing the ball back into the scrum once it has left... Sanction: Free-kick."
    explanation: null
    contributor: null

  - id: L19-029
    text: "A Blue flanker, bound in the scrum, reaches out and grabs the Red scrum-half. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Red"
      - "Free-kick to Red"
      - "Play on - defending the base is legal"
      - "Reset the scrum"
    answers: ["Penalty to Red"]
    law_reference: "19.38c"
    tags: ["scrum", "sanction"]
    law_quote: "Other restricted practices at a scrum include: ...non-front-row player holding or pushing an opponent... Sanction: Penalty."
    explanation: "Only in the scrum's front-row contest is opponent contact inherent - back-fivers grabbing opponents is a penalty."
    contributor: null

  - id: L19-030
    text: "The ball shoots out of the end of the tunnel, untouched. What do you do?"
    type: procedural
    difficulty: intermediate
    options:
      - "Reset the scrum - the same team throws in"
      - "Award the put-in to the other team"
      - "Free-kick against the throwing team"
      - "Play on"
    answers: ["Reset the scrum - the same team throws in"]
    law_reference: "19.34a"
    tags: ["scrum"]
    law_quote: "When there is no infringement, the referee will stop play and reset the scrum if: the scrum-half throws in the ball and it comes out at either end of the tunnel. When a scrum is reset, the ball is thrown in by the team that previously threw it in."
    explanation: "And remember: no advantage may be played on a ball out of the tunnel - immediate whistle (Law 7.3b)."
    contributor: null

  - id: L19-031
    text: "How do the front-row players bind at the referee's 'bind' call?"
    type: factual
    difficulty: advanced
    options:
      - "Loose-head's left arm inside the opposing tight-head's right; tight-head's right arm outside the opposing loose-head's left; gripping the back or side of the jersey"
      - "Each prop grips wherever they can reach"
      - "Both props bind on the opponent's arm"
      - "Props may bind on the opponent's shorts"
    answers: ["Loose-head's left arm inside the opposing tight-head's right; tight-head's right arm outside the opposing loose-head's left; gripping the back or side of the jersey"]
    law_reference: "19.11"
    tags: ["scrum", "front-row"]
    law_quote: "Each loose-head prop binds by placing the left arm inside the right arm of the opposing tight-head prop. Each tight-head prop binds by placing the right arm outside the left upper arm of the opposing loose-head prop. Each prop binds by gripping the back or side of their opponent's jersey. All players' binding is maintained for the duration of the scrum. Sanction: Penalty."
    explanation: "Binding on the arm, chest, or sleeve - or dropping the bind - is a penalty. Watch the tight-head's bind under pressure."
    contributor: null

  - id: L19-032
    text: "How must the players behind the front row bind?"
    type: factual
    difficulty: advanced
    options:
      - "Locks bind with the props in front of them and each other; all others bind on a lock's body with at least one arm"
      - "Any bind that keeps them attached"
      - "Locks bind only to each other"
      - "Flankers need not bind once the ball is in"
    answers: ["Locks bind with the props in front of them and each other; all others bind on a lock's body with at least one arm"]
    law_reference: "19.7"
    tags: ["scrum", "sanction"]
    law_quote: "The locks bind with the props immediately in front of them and with each other. All other players in the scrum bind on a lock's body with at least one arm. Sanction: Penalty."
    explanation: "The flanker detaching early to defend the base has left the scrum illegally if the ball is still in."
    contributor: null

  - id: L19-033
    text: "Before play in the scrum begins, where may the NON-throwing team's scrum-half stand?"
    type: factual
    difficulty: advanced
    options:
      - "On their team's side of the middle line next to the opposing 9, or at least 5m behind their hindmost foot"
      - "Anywhere within 5 metres of the scrum"
      - "Directly behind the opposing scrum-half"
      - "Level with the flankers on either side"
    answers: ["On their team's side of the middle line next to the opposing 9, or at least 5m behind their hindmost foot"]
    law_reference: "19.28"
    tags: ["scrum", "offside"]
    law_quote: "Prior to the start of play in the scrum, the scrum-half of the team not throwing in the ball stands: on that team's side of the middle line next to the opposing scrum-half, or at least five metres behind the hindmost foot of their team's last player in the scrum and remains there until the completion of the scrum."
    explanation: "Once play begins, the defending 9 tracking the ball must keep both feet no further than the tunnel's centre line (Law 19.30a) - or retire to hindmost foot or 5m back permanently."
    contributor: null

  - id: L19-034
    text: "The defending scrum is 3 metres from their own try line. Where is the offside line for their non-participating backs?"
    type: factual
    difficulty: advanced
    options:
      - "The try line"
      - "5 metres behind the hindmost foot, in in-goal"
      - "The dead-ball line"
      - "Level with the hindmost foot"
    answers: ["The try line"]
    law_reference: "19.32"
    tags: ["scrum", "offside", "in-goal"]
    law_quote: "When the hindmost foot of a team is in in-goal or within five metres of that team's try line, the offside line for that team's non-participants is the try line. Sanction: Penalty."
    explanation: "Same principle as the tackle and ruck - defenders never have to retreat beyond their own try line."
    contributor: null

  - id: L19-035
    text: "A bound second row grabs the ball in the scrum with a hand and lifts it backwards. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to the opposition - the ball may only be played with feet or lower legs, never lifted"
      - "Free-kick to the opposition"
      - "Play on - it moved the right way"
      - "Reset the scrum"
    answers: ["Penalty to the opposition - the ball may only be played with feet or lower legs, never lifted"]
    law_reference: "19.24"
    tags: ["scrum", "sanction"]
    law_quote: "Any player within the scrum may play the ball but only with their feet or lower legs and they must not lift the ball. Sanction: Penalty."
    explanation: "Hands in the scrum - the set-piece cousin of hands in the ruck."
    contributor: null

  - id: L19-036
    text: "The ball emerges from the scrum and a Blue back-rower immediately dives on it. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Red"
      - "Free-kick to Red"
      - "Play on - securing possession"
      - "Scrum again"
    answers: ["Penalty to Red"]
    law_reference: "19.38a"
    tags: ["scrum", "sanction"]
    law_quote: "Other restricted practices at a scrum include: falling on or over the ball immediately after it has emerged from the scrum... Sanction: Penalty."
    explanation: "Same principle as the ruck's emerging ball - stay on your feet and play it."
    contributor: null

  - id: L19-037
    text: "The ball is unintentionally kicked out of the tunnel for the third scrum in a row by the same front row. What do you do?"
    type: sanction
    difficulty: advanced
