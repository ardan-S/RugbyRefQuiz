  - sanction
  explanation: null
  contributor: null
- id: L06-006
  text: "PRINCIPLE: Every match is under the control of match officials who consist\
    \ of the \n             referee and two touch judges or assistant referees. Additional\
    \ persons, as authorised by the \n             match organisers may include the\
    \ reserve referee and/or reserve assistant referee, \n             the television\
    \ match official, the time-keeper, the match doctor, the team doctors, \n    \
    \         the non-playing members of the teams and the ball persons. \n      \
    \       Assistant referees and touch judges are responsible for signalling touch,\
    \ touch \n             in-goal and the success or otherwise of kicks at goal.\
    \ In addition, assistant referees \n             provide assistance as the referee\
    \ directs, including the reporting of foul play"
  type: factual
  difficulty: advanced
  options:
  - 'Yes'
  answers:
  - 'Yes'
  law_reference: '6'
  tags:
  - kick
  - goal
  - referee
  - touch-judge
  - assistant-referee
  explanation: null
  contributor: null
- id: L06-007
