metadata:
  law: 6
  title: Match Officials
  source: World Rugby Laws 2026
questions:
- id: L06-001
  text: |-
    The ball or ball-carrier touches the referee or other non-player and either team gains an advantage in the field of play. Award:
  type: sanction
  difficulty: intermediate
  options:
  - Scrum to attacking team
  - Scrum to team who last played the ball
  - Free-kick to attacking team
  - Free-kick to team who last played the ball
  answers:
  - Scrum to team who last played the ball
  law_reference: '6'
  tags:
  - advantage
  - referee
  - sanction
  explanation: null
  contributor: null
- id: L06-002
  text: |-
    The ball-carrier touches the referee or other non-player in in-goal, either team gains an advantage, the ball is in possession of an attacking player. Award:
  type: sanction
  difficulty: intermediate
  options:
  - 5m scrum to attacking team
  - 5m free-kick to attacking team
  - Try where contact took place
  - 5m scrum to defending team
  answers:
  - Try where contact took place
  law_reference: '6'
  tags:
  - goal
  - advantage
  - referee
  - sanction
  explanation: null
  contributor: null
- id: L06-003
  text: |-
    The ball-carrier touches the referee or other non-player in in-goal, either team gains an advantage, the ball is in possession of a defending player. Award:
  type: sanction
  difficulty: intermediate
  options:
  - 5m scrum to defending team
  - 5m free-kick to defending team
  - Touchdown where contact took place
  - 22m drop-out to defending team
  answers:
  - Touchdown where contact took place
  law_reference: '6'
  tags:
  - goal
  - advantage
  - referee
  - sanction
  explanation: null
  contributor: null
- id: L06-004
  text: 'A medic fields or touches the ball while it is in live play. Sanction:'
  type: sanction
  difficulty: intermediate
  options:
  - Temporary suspension of the medic
  - Sending off of the medic
  - Penalty where play would restart
  - Free-kick where play would restart
  answers:
