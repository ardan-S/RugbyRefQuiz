metadata:
  law: 21
  title: "In-Goal"
  source: "World Rugby Laws 2026"

questions:
  - id: L21-001
    text: "How can the ball be grounded in in-goal by holding it?"
    type: factual
    difficulty: beginner
    options:
      - "By touching the ground with it while holding it"
      - "By placing it on the ground"
      - "By pressing it into the ground"
      - "By rolling it on the ground"
    answers: ["By touching the ground with it while holding it"]
    law_reference: "21.1a"
    tags: ["grounding", "in-goal"]
    explanation: "Law 21.1a: The ball can be grounded by holding it and touching the ground with it."
    contributor: null

  - id: L21-002
    text: "How can the ball be grounded without holding it?"
    type: factual
    difficulty: intermediate
    options:
      - "By pressing down on it with hand, arm, or front of body from waist to neck"
      - "By kicking it into the ground"
      - "By standing on it"
      - "By rolling over it"
    answers: ["By pressing down on it with hand, arm, or front of body from waist to neck"]
    law_reference: "21.1b"
    tags: ["grounding", "in-goal"]
    explanation: "Law 21.1b: By pressing down on ball with hand/hands, arm/arms, or front of body from waist to neck."
    contributor: null

  - id: L21-003
    text: "Is picking up the ball in in-goal considered grounding it?"
    type: factual
    difficulty: intermediate
    options:
      - "No"
      - "Yes"
      - "Only if done with one hand"
      - "Only if in own in-goal"
    answers: ["No"]
    law_reference: "21.2"
    tags: ["grounding", "in-goal"]
    explanation: "Law 21.2: Picking up a ball is not grounding it. A player may pick it up and ground it elsewhere in in-goal."
    contributor: null

  - id: L21-004
    text: "An attacking player grounds the ball in in-goal. What is scored?"
    type: factual
    difficulty: beginner
    options:
      - "A try"
      - "A touchdown"
      - "A goal"
      - "Nothing yet"
    answers: ["A try"]
    law_reference: "21.3"
    tags: ["try", "grounding"]
    explanation: "Law 21.3: An attacking player grounding the ball in in-goal scores a try."
    contributor: null

  - id: L21-005
    text: "A defending player grounds the ball in their own in-goal. What is the result?"
    type: factual
    difficulty: beginner
    options:
      - "A touch down"
      - "A try to the attackers"
      - "A 22-metre drop-out"
      - "A scrum to the attackers"
    answers: ["A touch down"]
    law_reference: "21.6"
    tags: ["touchdown", "grounding"]
    explanation: "Law 21.6: A defending player grounding the ball in in-goal results in a touch down."
    contributor: null

  - id: L21-006
    text: "An attacking player grounds the ball but simultaneously touches the touch-in-goal line. What is the decision?"
    type: factual
    difficulty: intermediate
    options:
      - "22-metre drop-out to the defending team"
      - "Try"
      - "Lineout"
      - "Scrum 5 metres out"
    answers: ["22-metre drop-out to the defending team"]
    law_reference: "21.4"
    tags: ["grounding", "touch-in-goal"]
    explanation: "Law 21.4: If attacker grounds ball but touches touch-in-goal line or dead-ball line, 22-metre drop-out."
    contributor: null

  - id: L21-007
    text: "An attacking ball-carrier grounds the ball but simultaneously touches the touchline. What is the decision?"
    type: factual
    difficulty: intermediate
    options:
      - "Lineout to the opposition"
      - "Try"
      - "22-metre drop-out"
      - "Scrum 5 metres out"
    answers: ["Lineout to the opposition"]
    law_reference: "21.5"
    tags: ["grounding", "touch"]
    explanation: "Law 21.5: If ball-carrier touches touchline simultaneously, ball is in touch in field of play - lineout to opposition."
    contributor: null

  - id: L21-008
    text: "A tackled player has momentum that carries them into their own in-goal. Can they make a touch down?"
    type: factual
    difficulty: intermediate
    options:
      - "Yes"
      - "No - try to opposition"
      - "Only if tackled before the try line"
      - "Only with referee permission"
    answers: ["Yes"]
    law_reference: "21.7"
    tags: ["touchdown", "momentum"]
    explanation: "Law 21.7: If a tackled player has momentum that carries them into their own in-goal, they can make a touch down."
    contributor: null

  - id: L21-009
    text: "A tackled player near their own try line reaches out to ground the ball for a touch down. Is this permitted?"
    type: factual
    difficulty: intermediate
    options:
      - "Yes, if done immediately"
      - "No, they must release the ball"
      - "Only in the final 5 minutes"
      - "Only if no defenders are near"
    answers: ["Yes, if done immediately"]
    law_reference: "21.8"
    tags: ["touchdown", "reaching"]
    explanation: "Law 21.8: A tackled player near their try line may reach out and ground the ball for a touch down if done immediately."
    contributor: null

  - id: L21-010
    text: "A player is in touch but not holding the ball. Can they ground the ball in in-goal?"
    type: factual
    difficulty: advanced
    options:
      - "Yes"
      - "No"
      - "Only for a touch down"
      - "Only with one hand"
    answers: ["Yes"]
    law_reference: "21.9"
    tags: ["grounding", "touch"]
    explanation: "Law 21.9: A player in touch or touch-in-goal can score a try or make a touch down by grounding the ball in in-goal if not holding it."
    contributor: null

  - id: L21-011
    text: "A defender kicks the ball from an attacker who is reaching out to score a try. What is the sanction?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty"
      - "Try awarded"
      - "Play on - legal"
      - "Free-kick"
    answers: ["Penalty"]
    law_reference: "21.10"
    tags: ["grounding", "foul-play", "sanction"]
    explanation: "Law 21.10: Defenders may knock or pull ball away but must not kick or attempt to kick the ball. Sanction: Penalty."
    contributor: null

  - id: L21-012
    text: "A team kicks the ball from the field of play into touch-in-goal. What options does the defending team have?"
    type: factual
    difficulty: advanced
    options:
      - "22-metre drop-out or scrum where ball was kicked"
      - "22-metre drop-out only"
      - "Try line drop-out"
      - "Scrum 5 metres out"
    answers: ["22-metre drop-out or scrum where ball was kicked"]
    law_reference: "21.11"
    tags: ["in-goal", "kick-dead"]
    explanation: "Law 21.11: If kicked dead through in-goal, defenders can choose 22-metre drop-out or scrum where ball was kicked."
    contributor: null

  - id: L21-013
    text: "An unsuccessful penalty goal attempt goes into in-goal and is made dead. What is the restart?"
    type: factual
    difficulty: intermediate
    options:
      - "22-metre drop-out"
      - "Try line drop-out"
      - "Scrum where penalty was taken"
      - "Scrum 5 metres out"
    answers: ["22-metre drop-out"]
    law_reference: "21.11"
    tags: ["penalty-goal", "22-drop-out"]
    explanation: "Law 21.11: Exception for unsuccessful penalty or drop goal attempt - 22-metre drop-out."
    contributor: null

  - id: L21-014
    text: "If any part of a defending player is in in-goal, where is that player considered to be?"
    type: factual
    difficulty: intermediate
    options:
      - "In in-goal (unless also in touch or on/over dead-ball line)"
      - "In the field of play"
      - "Depends on where feet are"
      - "Depends on where ball is"
    answers: ["In in-goal (unless also in touch or on/over dead-ball line)"]
    law_reference: "21.12"
    tags: ["in-goal", "position"]
    explanation: "Law 21.12: If any part of a defending player is in in-goal, they are in in-goal (unless also in touch or on/over dead-ball line)."
    contributor: null

  - id: L21-015
    text: "A player in in-goal catches a ball that is still in the field of play. What happens?"
    type: factual
    difficulty: advanced
    options:
      - "The player has taken the ball into in-goal"
      - "Play continues in the field of play"
      - "Try line drop-out"
      - "22-metre drop-out"
    answers: ["The player has taken the ball into in-goal"]
    law_reference: "21.13"
    tags: ["in-goal", "carrying-in"]
    explanation: "Law 21.13: If a player in in-goal catches or picks up a ball still in the field of play, they have taken it into in-goal."
    contributor: null

  - id: L21-016
    text: "A player on the dead-ball line picks up a ball within in-goal. What is the result?"
    type: factual
    difficulty: advanced
    options:
      - "The ball is dead"
      - "Try line drop-out"
      - "Play continues"
      - "22-metre drop-out"
    answers: ["The ball is dead"]
    law_reference: "21.14"
    tags: ["in-goal", "dead-ball-line"]
    explanation: "Law 21.14: If a player on/beyond the dead-ball line picks up ball within in-goal, they have made the ball dead."
    contributor: null

  - id: L21-017
    text: "The ball or ball-carrier touches a corner flag post. What happens (if not otherwise in touch)?"
    type: factual
    difficulty: intermediate
    options:
      - "Play continues unless ball is grounded against the post"
      - "Ball is in touch"
      - "Lineout awarded"
      - "Try is awarded"
    answers: ["Play continues unless ball is grounded against the post"]
    law_reference: "21.15"
    tags: ["corner-flag", "in-goal"]
    explanation: "Law 21.15: If ball or carrier touches corner post without being in touch, play continues unless ball is grounded against it."
    contributor: null

  - id: L21-018
    text: "A ball-carrier is held up in in-goal. What is the decision?"
    type: factual
    difficulty: beginner
    options:
      - "Ball is dead - try line drop-out or 5m scrum depending on how ball entered"
      - "Try is awarded"
      - "22-metre drop-out"
      - "Scrum 5 metres out to attacking team"
    answers: ["Ball is dead - try line drop-out or 5m scrum depending on how ball entered"]
    law_reference: "21.16"
    tags: ["held-up", "in-goal"]
    explanation: "Law 21.16: When ball-carrier is held up in-goal, ball is dead. Restart depends on how ball entered in-goal."
    contributor: null

  - id: L21-019
    text: "There is doubt about which team first grounded the ball in in-goal. What happens?"
    type: factual
    difficulty: intermediate
    options:
      - "5-metre scrum with attacking team throwing in"
      - "22-metre drop-out"
      - "Try line drop-out"
      - "Penalty to attacking team"
    answers: ["5-metre scrum with attacking team throwing in"]
    law_reference: "21.17"
    tags: ["doubt", "grounding", "scrum"]
    explanation: "Law 21.17: If doubt about which team grounded first, 5-metre scrum in line with grounding, attacking team throws in."
    contributor: null

  - id: L21-020
    text: "A tackled player delays reaching out to ground the ball in their own in-goal for a touch down. What is the sanction?"
    type: sanction
    difficulty: advanced
    options:
      - "Penalty"
      - "Try to opposition"
      - "Play on"
      - "Free-kick"
    answers: ["Penalty"]
    law_reference: "21.8"
    tags: ["touchdown", "delay", "sanction"]
    explanation: "Law 21.8: Reaching out for touch down must be done immediately. Sanction if delayed: Penalty."
    contributor: null
