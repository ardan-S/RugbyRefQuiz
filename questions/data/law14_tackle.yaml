metadata:
  law: 14
  title: "Tackle"
  source: "World Rugby Laws 2026"

questions:
  - id: L14-001
    text: "Where can a tackle take place?"
    type: factual
    difficulty: beginner
    options:
      - "Anywhere in the field of play"
      - "Anywhere in the playing area, including in-goal"
      - "Only between the two 22-metre lines"
      - "Only in open play, not at set-piece"
    answers: ["Anywhere in the field of play"]
    law_reference: "14"
    tags: ["tackle"]
    law_quote: "A tackle can take place anywhere in the field of play. The actions of players involved in the tackle must ensure a fair contest and allow the ball to be available for play immediately."
    explanation: "Field of play - not in-goal. A ball-carrier held and brought down in in-goal is not a 'tackle' in law; different rules apply there."
    contributor: null

  - id: L14-002
    text: "What is required for a tackle to occur?"
    type: factual
    difficulty: beginner
    options:
      - "The ball-carrier is held AND brought to ground by one or more opponents"
      - "The ball-carrier goes to ground for any reason"
      - "Any contact from an opponent"
      - "The ball-carrier is wrapped by both arms"
    answers: ["The ball-carrier is held AND brought to ground by one or more opponents"]
    law_reference: "14.1"
    tags: ["tackle"]
    law_quote: "For a tackle to occur, the ball-carrier is held and brought to ground by one or more opponents."
    explanation: "Both elements - held AND brought to ground. A slip with no hold is not a tackle (Law 13 applies); held but staying up may become a maul."
    contributor: null

  - id: L14-003
    text: "What does 'brought to ground' mean for the ball-carrier?"
    type: factual
    difficulty: intermediate
    options:
      - "Lying, sitting, or at least one knee on the ground (or on a player on the ground)"
      - "Both knees down"
      - "Torso in contact with the ground"
      - "Any body part except the feet touching the ground"
    answers: ["Lying, sitting, or at least one knee on the ground (or on a player on the ground)"]
    law_reference: "14.2"
    tags: ["tackle"]
    law_quote: "Being brought to ground means that the ball-carrier is lying, sitting or has at least one knee on the ground or on another player who is on the ground."
    explanation: "One knee is enough - and a knee on a body counts the same as a knee on grass."
    contributor: null

  - id: L14-004
    text: "What does 'held' mean for the tackler?"
    type: factual
    difficulty: intermediate
    options:
      - "The tackler continues holding the ball-carrier until the ball-carrier is on the ground"
      - "Any momentary grip on the ball-carrier"
      - "A two-armed wrap"
      - "Contact for at least one second"
    answers: ["The tackler continues holding the ball-carrier until the ball-carrier is on the ground"]
    law_reference: "14.3"
    tags: ["tackle"]
    law_quote: "Being held means that a tackler must continue holding the ball-carrier until the ball-carrier is on the ground."
    explanation: "If the grip is released before the carrier grounds, there is no tackle - and no tackler rights at the ensuing contest."
    contributor: null

  - id: L14-005
    text: "Who are the 'players in a tackle'?"
    type: factual
    difficulty: intermediate
    options:
      - "The tackled player, tackler(s), and others - assist players staying up, arrivers, and those already on the ground"
      - "Only the tackled player and tackler(s)"
      - "Everyone within 10 metres"
      - "Only players who have touched the ball"
    answers: ["The tackled player, tackler(s), and others - assist players staying up, arrivers, and those already on the ground"]
    law_reference: "14.4"
    tags: ["tackle"]
    law_quote: "Players in a tackle are: tackled player; tackler(s); others: player(s) who hold the ball-carrier during a tackle but do not go to ground; player(s) who arrive to contest possession in the tackle; player(s) who are already on the ground."
    explanation: "The categories matter because each carries different obligations - a 'tackler' went to ground; an assist who stayed up is an 'other' with no tackler privileges."
    contributor: null

  - id: L14-006
    text: "Red 7 tackles Blue 12 and both go to ground. Red 7 keeps hold of the ball. What do you award?"
    type: sanction
    difficulty: beginner
    options:
      - "Penalty to Blue - the tackler must release immediately"
      - "Free-kick to Blue"
      - "Scrum to Blue"
      - "Play on - the tackler may compete"
    answers: ["Penalty to Blue - the tackler must release immediately"]
    law_reference: "14.5a"
    tags: ["tackle", "tackler", "release", "sanction"]
    law_quote: "Tacklers must: immediately release the ball and the ball-carrier after both players go to ground. Sanction: Penalty."
    explanation: "Release means ball AND carrier. The tackler can only compete again after releasing, getting up, and coming from their own side (Law 14.6)."
    contributor: null

  - id: L14-007
    text: "After a tackle, Red 7 releases but lies between the ball and the arriving Blue players. What do you award?"
    type: sanction
    difficulty: beginner
    options:
      - "Penalty to Blue - the tackler must move away or get up"
      - "Free-kick to Blue"
      - "Play on - Red 7 released"
      - "Scrum to Blue"
    answers: ["Penalty to Blue - the tackler must move away or get up"]
    law_reference: "14.5b"
    tags: ["tackle", "tackler", "sanction"]
    law_quote: "Tacklers must: immediately move away from the tackled player and from the ball or get up."
    explanation: "The 'lazy tackler' blocking the recycle - releasing is step one; clearing the space is step two."
    contributor: null

  - id: L14-008
    text: "Still on the ground after making the tackle, Red 7 flicks the ball back to a team-mate. What do you award?"
    type: sanction
    difficulty: beginner
    options:
      - "Penalty to Blue - the tackler must be on their feet to play the ball"
      - "Play on - tacklers may play immediately"
      - "Scrum to Blue"
      - "Free-kick to Blue"
    answers: ["Penalty to Blue - the tackler must be on their feet to play the ball"]
    law_reference: "14.5c"
    tags: ["tackle", "tackler", "sanction"]
    law_quote: "Tacklers must: be on their feet before attempting to play the ball."
    explanation: "On their feet means supporting their own body weight - not propped on the tackled player."
    contributor: null

  - id: L14-009
    text: "Red 7's tackle traps Blue 12's arms so Blue 12 cannot release the ball. Blue 12 holds on. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue - the tackler must allow the tackled player to release the ball"
      - "Penalty to Red - holding on"
      - "Scrum to the team going forward"
      - "Play on"
    answers: ["Penalty to Blue - the tackler must allow the tackled player to release the ball"]
    law_reference: "14.5d"
    tags: ["tackle", "tackler", "sanction"]
    law_quote: "Tacklers must: allow the tackled player to release or play the ball."
    explanation: "Sequence your decision: the carrier cannot be penalised for failing to do something the tackler prevented. Tackler first."
    contributor: null

  - id: L14-010
    text: "Red 7 pins the tackled Blue 12 in place so Blue 12 cannot roll clear of the ball. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue - the tackler must allow the tackled player to move away"
      - "Penalty to Red - Blue 12 is lying near the ball"
      - "Scrum to Blue"
      - "Play on"
    answers: ["Penalty to Blue - the tackler must allow the tackled player to move away"]
    law_reference: "14.5e"
    tags: ["tackle", "tackler", "sanction"]
    law_quote: "Tacklers must: allow the tackled player to move away from the ball."
    explanation: "Same sequencing principle - who caused the mess? The trapped player is not the offender."
    contributor: null

  - id: L14-011
    text: "Having released and got to their feet, from which direction may the tackler play the ball?"
    type: factual
    difficulty: advanced
    options:
      - "From the direction of their own try line, provided no ruck has formed"
      - "From any direction - tacklers are exempt from the gate"
      - "Only from directly behind the ball"
      - "They may never play the ball again in that tackle"
    answers: ["From the direction of their own try line, provided no ruck has formed"]
    law_reference: "14.6"
    tags: ["tackle", "tackler"]
    law_quote: "Tacklers may play the ball from the direction of their own try line provided they have complied with the above responsibilities and a ruck has not formed."
    explanation: "The 2026 law removed the old 'from any direction' tackler exemption - tacklers now come through their own side like everyone else."
    contributor: null

  - id: L14-012
    text: "The tackler is on their feet, hands on the ball - then a ruck forms. May the tackler keep playing the ball?"
    type: factual
    difficulty: advanced
    options:
      - "A tackler already legally on the ball may stay; a ruck forming BEFORE they play it ends their chance"
      - "Yes - a tackler's rights survive the ruck"
      - "No - they must release the instant any opponent binds"
      - "Only if the scrum-half has not arrived"
    answers: ["A tackler already legally on the ball may stay; a ruck forming BEFORE they play it ends their chance"]
    law_reference: "14.6"
    tags: ["tackle", "tackler", "ruck"]
    law_quote: "Tacklers may play the ball from the direction of their own try line provided they have complied with the above responsibilities and a ruck has not formed."
    explanation: "Once the jackler is legally on the ball before the ruck forms, they may keep contesting (Law 15.11 lets them be removed by driving). If the ruck forms first, hands off."
    contributor: null

  - id: L14-013
    text: "What must the tackled player immediately do with the ball?"
    type: factual
    difficulty: beginner
    options:
      - "Make it available - release, pass, or push it in any direction except forward"
      - "Hold it until team-mates secure it"
      - "Push it in any direction, including forward"
      - "Stand up with it - nothing else is legal"
    answers: ["Make it available - release, pass, or push it in any direction except forward"]
    law_reference: "14.7a"
    tags: ["tackle", "tackled-player"]
    law_quote: "Tackled players must immediately: make the ball available so that play can continue by releasing, passing or pushing the ball in any direction except forward. They may place the ball in any direction."
    explanation: "Note the asymmetry - PUSHING forward is banned, but PLACING in any direction (including towards the opponents' line) is legal."
    contributor: null

  - id: L14-014
    text: "May the tackled player PLACE the ball towards the opponents' try line?"
    type: factual
    difficulty: intermediate
    options:
      - "Yes - the ball may be placed in any direction"
      - "No - only backwards"
      - "No - only sideways or backwards"
      - "Only if no opponent is contesting"
    answers: ["Yes - the ball may be placed in any direction"]
    law_reference: "14.7a"
    tags: ["tackle", "tackled-player"]
    law_quote: "They may place the ball in any direction."
    explanation: "The long place towards your own attacking line is legal - it is pushing the ball FORWARD that is not."
    contributor: null

  - id: L14-015
    text: "Blue 12 is tackled and keeps hold of the ball on the ground. What do you award?"
    type: sanction
    difficulty: beginner
    options:
      - "Penalty to Red - holding on"
      - "Free-kick to Red"
      - "Scrum to Red"
      - "Turnover ball, play on"
    answers: ["Penalty to Red - holding on"]
    law_reference: "14.7a"
    tags: ["tackle", "tackled-player", "sanction"]
    law_quote: "Tackled players must immediately: make the ball available so that play can continue... Sanction: Penalty."
    explanation: "Check the tackler complied first - if the carrier was prevented from releasing, the penalty goes the other way (Law 14.5d)."
    contributor: null

  - id: L14-016
    text: "Tackled just short of the line, Blue 12 deliberately lies over the ball so Red cannot play it. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Red - sealing the ball off"
      - "Scrum to Red"
      - "Play on if the ball eventually emerges"
      - "Free-kick to Red"
    answers: ["Penalty to Red - sealing the ball off"]
    law_reference: "14.7c"
    tags: ["tackle", "tackled-player", "sanction"]
    law_quote: "Tackled players must immediately: ensure that they do not lie on, over or near the ball to prevent opposition players from gaining possession of it."
    explanation: "Near their own line with a penalty already likely, think about the cynical-offence card as well."
    contributor: null

  - id: L14-017
    text: "After making the ball available, what must the tackled player do?"
    type: factual
    difficulty: intermediate
    options:
      - "Move away from the ball or get up"
      - "Stay down until the ruck is over"
      - "Roll towards their own team"
      - "Nothing further - their obligations are complete"
    answers: ["Move away from the ball or get up"]
    law_reference: "14.7b"
    tags: ["tackle", "tackled-player"]
    law_quote: "Tackled players must immediately: move away from the ball or get up."
    explanation: null
    contributor: null

  - id: L14-018
    text: "An arriving Red player goes off their feet as they play the ball at a tackle. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue - players must stay on their feet to play the ball"
      - "Play on - securing possession is legal"
      - "Scrum to Blue"
      - "Free-kick to Blue"
    answers: ["Penalty to Blue - players must stay on their feet to play the ball"]
    law_reference: "14.8b"
    tags: ["tackle", "arriving-player", "sanction"]
    law_quote: "Other players must: remain on their feet when they play the ball."
    explanation: "Off feet at the tackle - the bread-and-butter breakdown penalty. Judge whether they were supporting their own body weight."
    contributor: null

  - id: L14-019
    text: "From where must arriving players enter before playing the ball at a tackle?"
    type: factual
    difficulty: intermediate
    options:
      - "From the direction of their own try line (through 'the gate')"
      - "From any direction, if they are first to arrive"
      - "From behind the hindmost foot of the ruck"
      - "From the side nearest their captain"
    answers: ["From the direction of their own try line (through 'the gate')"]
    law_reference: "14.8c"
    tags: ["tackle", "arriving-player"]
    law_quote: "Other players must: arrive at the tackle from the direction of their own try line before playing the ball."
    explanation: "'The gate' in common parlance - the law's actual words are 'from the direction of their own try line'."
    contributor: null

  - id: L14-020
    text: "Blue 6 arrives at the side of the tackle and plays the ball. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Red - entry not from Blue's own try line direction"
      - "Play on - first arriver may come from anywhere"
      - "Scrum to Red"
      - "Free-kick to Red"
    answers: ["Penalty to Red - entry not from Blue's own try line direction"]
    law_reference: "14.8c"
    tags: ["tackle", "arriving-player", "sanction"]
    law_quote: "Other players must: arrive at the tackle from the direction of their own try line before playing the ball."
    explanation: null
    contributor: null

  - id: L14-021
    text: "Lying on the ground near a tackle, Red 3 pats the loose ball back to Red's side. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue - playing the ball from the ground near the tackle"
      - "Play on - the ball was loose"
      - "Scrum to Blue"
      - "Free-kick to Blue"
    answers: ["Penalty to Blue - playing the ball from the ground near the tackle"]
    law_reference: "14.8d"
    tags: ["tackle", "sanction"]
    law_quote: "Other players must: not play the ball or attempt to tackle an opponent while on the ground near the tackle."
    explanation: null
    contributor: null

  - id: L14-022
    text: "From the ground near a tackle, Red 3 wraps up a Blue player trying to step over the ball. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue - tackling from the ground"
      - "Play on - protecting the ball"
      - "Scrum to Blue"
      - "Free-kick to Blue"
    answers: ["Penalty to Blue - tackling from the ground"]
    law_reference: "14.8d"
    tags: ["tackle", "sanction"]
    law_quote: "Other players must: not play the ball or attempt to tackle an opponent while on the ground near the tackle."
    explanation: null
    contributor: null

  - id: L14-023
    text: "Clearing out at a tackle, Blue 4 grabs Red 7 (who is legally contesting) and rolls them to the ground. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Red - rolling an opponent in the tackle"
      - "Play on - a standard clear-out"
      - "Scrum to Red"
      - "Free-kick to Red"
    answers: ["Penalty to Red - rolling an opponent in the tackle"]
    law_reference: "14.8e"
    tags: ["tackle", "clearout", "sanction"]
    law_quote: "Other players must: not roll, pull or twist an opponent, who is involved in the tackle, to the ground."
    explanation: "The legal removal is pushing or driving backwards, including via the knee/leg (Law 9.20d). Roll, pull or twist is always a penalty."
    contributor: null

  - id: L14-024
    text: "Red 12 holds the ball-carrier in the tackle but stays on their feet. What are Red 12's obligations?"
    type: factual
    difficulty: advanced
    options:
      - "Release the ball and carrier immediately - as an assist, they have no tackler privileges"
      - "None - they are a tackler and may play the ball straight away"
      - "Only to stay on their feet"
      - "To retreat to the offside line before doing anything"
    answers: ["Release the ball and carrier immediately - as an assist, they have no tackler privileges"]
    law_reference: "14.8a"
    tags: ["tackle", "arriving-player"]
    law_quote: "Other players must: remain on their feet and release the ball and the ball-carrier immediately."
    explanation: "The 'tackle assist' trap - a player who held but never went to ground is an OTHER, not a tackler. They must release and re-enter from their own side before contesting."
    contributor: null

  - id: L14-025
    text: "Red 8 wins the ball on their feet at a tackle. What must Red 8 do?"
    type: factual
    difficulty: intermediate
    options:
      - "Play it immediately - move away, pass, or kick"
      - "Wait for the ruck to form around them"
      - "Go to ground to secure possession"
      - "Hand it to the scrum-half"
    answers: ["Play it immediately - move away, pass, or kick"]
    law_reference: "14.9a"
    tags: ["tackle", "possession"]
    law_quote: "Any player who gains possession of the ball: must play it immediately, by moving away, or by passing or kicking the ball."
    explanation: null
    contributor: null

  - id: L14-026
    text: "Red 8 wins the ball at a tackle, then voluntarily dives to the ground with it, untouched. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue - going to ground at the tackle without being tackled"
      - "Play on - protecting the ball"
      - "Scrum to Blue"
      - "Free-kick to Blue"
    answers: ["Penalty to Blue - going to ground at the tackle without being tackled"]
    law_reference: "14.9b"
    tags: ["tackle", "possession", "sanction"]
    law_quote: "Any player who gains possession of the ball: must remain on their feet, and not go to ground at or near the tackle unless tackled by the opposition."
    explanation: "Flopping with the ball to kill the contest is a penalty - only an actual opposition tackle excuses going down."
    contributor: null

  - id: L14-027
    text: "Red 8 has just won the ball on their feet at a tackle. May Blue tackle Red 8?"
    type: factual
    difficulty: intermediate
    options:
      - "Yes - provided the tackler comes from the direction of Blue's own try line"
      - "No - the winner of the ball is protected"
      - "Yes - from any direction"
      - "Only once Red 8 leaves the tackle area"
    answers: ["Yes - provided the tackler comes from the direction of Blue's own try line"]
    law_reference: "14.9c"
    tags: ["tackle", "possession"]
    law_quote: "[Any player who gains possession of the ball] may be tackled, provided the tackler does so from the direction of their own try line."
    explanation: "The new pick-and-go carrier is live immediately - but the tackle must come through Blue's side, not around the corner."
    contributor: null

  - id: L14-028
    text: "Red 8 wins the ball at the tackle but stands still over it, waiting for support. What do you award?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue - the ball must be played immediately"
      - "Play on - possession has been won"
      - "Scrum to Blue"
      - "Free-kick to Blue"
    answers: ["Penalty to Blue - the ball must be played immediately"]
    law_reference: "14.9a"
    tags: ["tackle", "possession", "sanction"]
    law_quote: "Any player who gains possession of the ball: must play it immediately, by moving away, or by passing or kicking the ball. Sanction: Penalty."
    explanation: "In practice, allow a heartbeat - but a player planted over the ball inviting contact is not 'playing it immediately'."
    contributor: null

  - id: L14-029
    text: "When are offside lines created at a tackle?"
    type: factual
    difficulty: advanced
    options:
      - "When at least one player is on their feet and over the ball, which is on the ground"
      - "The moment the tackle is completed"
      - "Only when a ruck forms"
      - "When the referee calls 'tackle'"
    answers: ["When at least one player is on their feet and over the ball, which is on the ground"]
    law_reference: "14.10"
    tags: ["tackle", "offside"]
    law_quote: "Offside lines are created at a tackle when at least one player is on their feet and over the ball, which is on the ground."
    explanation: "No one over the ball = no offside lines yet - defenders may still advance from anywhere through their own side."
    contributor: null

  - id: L14-030
    text: "Where do the offside lines run once created at a tackle?"
    type: factual
    difficulty: advanced
    options:
      - "Parallel to the try lines, through the hindmost point of any player in the tackle or on their feet over the ball"
      - "One metre behind the ball on each side"
      - "Through the middle of the tackled player"
      - "Five metres either side of the tackle"
    answers: ["Parallel to the try lines, through the hindmost point of any player in the tackle or on their feet over the ball"]
    law_reference: "14.10"
    tags: ["tackle", "offside"]
    law_quote: "Each team's offside line runs parallel to the try line through the hindmost point of any player in the tackle or on their feet over the ball."
    explanation: null
    contributor: null

  - id: L14-031
    text: "At a tackle near the line, the hindmost point of the defending team's player is behind their try line. Where is the defenders' offside line?"
    type: factual
    difficulty: advanced
    options:
      - "The try line"
      - "The hindmost point, even behind the try line"
      - "The five-metre line"
      - "There is no offside line in that case"
    answers: ["The try line"]
    law_reference: "14.10"
    tags: ["tackle", "offside", "in-goal"]
    law_quote: "If that point is on or behind the try line, the offside line for that team is the try line."
    explanation: "Defenders can stand ON their own try line at a tackle inches out - they don't have to retreat into in-goal."
    contributor: null

  - id: L14-032
    text: "Which of these does NOT end a tackle?"
    type: factual
    difficulty: intermediate
    options:
      - "The tackled player releasing the ball"
      - "A ruck forming"
      - "A player on their feet gaining possession and moving away, passing or kicking"
      - "The ball leaving the tackle area"
    answers: ["The tackled player releasing the ball"]
    law_reference: "14.11"
    tags: ["tackle"]
    law_quote: "The tackle ends when: a ruck is formed; a player on their feet from either team gains possession of the ball and moves away or passes or kicks the ball; the ball leaves the tackle area; the ball is unplayable."
    explanation: "Release starts the contest, it doesn't end the tackle - the tackle's obligations run until one of the four endings occurs."
    contributor: null

  - id: L14-033
    text: "The ball is unplayable at a tackle and you cannot tell who failed to comply. What do you award?"
    type: sanction
    difficulty: advanced
    options:
      - "Scrum - throw to the team that was moving forward, or the attacking team if neither was"
      - "Scrum - always to the defending team"
      - "Penalty against the tackled player's team"
      - "Drop-out"
    answers: ["Scrum - throw to the team that was moving forward, or the attacking team if neither was"]
    law_reference: "14.11d"
    tags: ["tackle", "sanction"]
    law_quote: "The ball is unplayable. If there is doubt about which player did not conform to law, the referee orders a scrum. The throw is taken by the team moving forward prior to the stoppage or, if no team was moving forward, by the attacking team."
    explanation: "'When in doubt, scrum' - but only when genuinely in doubt. If you saw the offence, penalise it."
    contributor: null

  - id: L14-034
    text: "Red 7 tackles Blue 10. Both go to ground. Red 7 releases the ball but stays lying across Blue 10's legs. What do you award?"
    type: scenario
    difficulty: intermediate
    options:
      - "Penalty to Blue - the tackler has not moved away"
      - "Play on - Red 7 released the ball"
      - "Scrum to Blue"
      - "Free-kick to Blue"
    answers: ["Penalty to Blue - the tackler has not moved away"]
    law_reference: "14.5b"
    tags: ["tackle", "tackler"]
    law_quote: "Tacklers must: immediately move away from the tackled player and from the ball or get up."
    explanation: "Releasing the ball is not enough - lying across the player's legs pins them and blocks the contest."
    contributor: null

  - id: L14-035
    text: "Blue 9 arrives at a fresh tackle from the side and picks up the ball. What do you award?"
    type: scenario
    difficulty: intermediate
    options:
      - "Penalty to Red - side entry"
      - "Play on - the scrum-half may enter from anywhere"
      - "Scrum to Red"
      - "Free-kick to Red"
    answers: ["Penalty to Red - side entry"]
    law_reference: "14.8c"
    tags: ["tackle", "arriving-player"]
