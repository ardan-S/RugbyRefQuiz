metadata:
  law: 10
  title: "Offside and Onside in Open Play"
  source: "World Rugby Laws 2026"

questions:
  - id: L10-001
    text: "When is a player offside in open play?"
    type: factual
    difficulty: beginner
    options:
      - "When in front of a team-mate who is carrying the ball or who last played it"
      - "When behind the ball-carrier"
      - "When within 5 metres of the ball"
      - "When in the opposition half"
    answers: ["When in front of a team-mate who is carrying the ball or who last played it"]
    law_reference: "10.1"
    tags: ["offside"]
    law_quote: "A player is offside in open play if that player is in front of a team-mate who is carrying the ball or who last played it. An offside player must not interfere with play."
    explanation: "Being offside is a POSITION, not automatically an offence - the offence is interfering with play from that position."
    contributor: null

  - id: L10-002
    text: "An offside Red player plays the ball. What do you award?"
    type: sanction
    difficulty: beginner
    options:
      - "Penalty to Blue"
      - "Free-kick to Blue"
      - "Scrum to Blue"
      - "Play on"
    answers: ["Penalty to Blue"]
    law_reference: "10.1a"
    tags: ["offside", "sanction"]
    law_quote: "An offside player must not interfere with play. This includes: playing the ball; tackling the ball-carrier; preventing the opposition from playing as they wish; loitering in an offside position."
    explanation: "All four forms of interference carry the same sanction - penalty."
    contributor: null

  - id: L10-003
    text: "Where in the playing area can a player be offside?"
    type: factual
    difficulty: beginner
    options:
      - "Anywhere in the playing area"
      - "Only in the opposition half"
      - "Only within 10 metres of the ball"
      - "Only inside either 22"
    answers: ["Anywhere in the playing area"]
    law_reference: "10.2"
    tags: ["offside"]
    law_quote: "A player can be offside anywhere in the playing area."
    explanation: null
    contributor: null

  - id: L10-004
    text: "Red 12 accidentally throws the ball forward and Red 14, in front of them, catches it. Is Red 14 offside?"
    type: factual
    difficulty: intermediate
    options:
      - "No - a player receiving an unintentional throw forward is not offside"
      - "Yes - they were in front of the passer"
      - "Only if Red 14 gains ground"
      - "Yes, and it is a penalty"
    answers: ["No - a player receiving an unintentional throw forward is not offside"]
    law_reference: "10.3"
    tags: ["offside", "throw-forward"]
    law_quote: "A player who receives an unintentional throw forward is not offside."
    explanation: "The forward pass itself is still a scrum under Law 11 - but don't add an offside penalty on top."
    contributor: null

  - id: L10-005
    text: "After a team-mate's kick, an offside Red player moves towards the ball. What is the sanction?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue (or the 10.4c scrum option)"
      - "Free-kick to Blue"
      - "Nothing until they touch the ball"
      - "Scrum only"
    answers: ["Penalty to Blue (or the 10.4c scrum option)"]
    law_reference: "10.4b"
    tags: ["offside", "sanction"]
    law_quote: "An offside player may be penalised, if that player: does not make an effort to retreat and interferes with play; or moves towards the ball..."
    explanation: "Moving TOWARDS the ball is itself penalisable - the offside player's only job is to retreat or stand still out of the game."
    contributor: null

  - id: L10-006
    text: "Red 10 kicks ahead. Where must Red players who were in front of the kicker retire to?"
    type: factual
    difficulty: intermediate
    options:
      - "Behind an onside team-mate, or behind an imaginary line 10m their side of where the ball lands or is caught"
      - "Behind the kicker's original position"
      - "Behind the half-way line"
      - "5 metres from the catcher"
    answers: ["Behind an onside team-mate, or behind an imaginary line 10m their side of where the ball lands or is caught"]
    law_reference: "10.4c"
    tags: ["offside", "10-metre-law"]
    law_quote: "[The player] was in front of a team-mate who kicked the ball and fails to retire immediately behind an onside team-mate or an imaginary line across the field 10 metres on that player's side from where the ball is caught or lands, even if it hits a goal post or crossbar first."
    explanation: "This is the 10-metre law. If several players are inside the 10m, the one closest to where the ball lands or is caught is the one penalised."
    contributor: null

  - id: L10-007
    text: "A Red player breaches the 10-metre law. What are Blue's options?"
    type: sanction
    difficulty: advanced
    options:
      - "Penalty at the place of infringement, OR a scrum where Red last played the ball"
      - "Penalty only"
      - "Free-kick or scrum"
      - "Scrum only"
    answers: ["Penalty at the place of infringement, OR a scrum where Red last played the ball"]
    law_reference: "10.4c"
    tags: ["offside", "10-metre-law", "sanction"]
    law_quote: "Sanction: The non-offending team can choose either: penalty at the place of infringement; or scrum where the offending team last played the ball."
    explanation: "The scrum option can be the better choice when the kick was made deep in the kicking team's territory."
    contributor: null

  - id: L10-008
    text: "Blue charge down Red 10's kick. Does the 10-metre law apply to Red players in front of the kicker?"
    type: factual
    difficulty: advanced
    options:
      - "No - the 10-metre law does not apply to a charged-down kick"
      - "Yes - it applies to every kick"
      - "Only if the charge-down was deliberate"
      - "Only inside the 22"
    answers: ["No - the 10-metre law does not apply to a charged-down kick"]
    law_reference: "10.4c"
    tags: ["offside", "10-metre-law"]
    law_quote: "This is known as the 10-metre law and still applies if the ball touches or is played by an opponent but not when the kick is charged down."
    explanation: "Key distinction: an opponent merely TOUCHING the ball downfield keeps the 10-metre law alive; a CHARGE DOWN kills it and puts everyone onside."
    contributor: null

  - id: L10-009
    text: "Red 6 cannot avoid being hit by a pass from a team-mate while standing offside. When do you stop play?"
    type: factual
    difficulty: intermediate
    options:
      - "Only if Red (the offending team) gain an advantage"
      - "Immediately, always"
      - "Never - accidental contact is ignored"
      - "Only if Blue appeal"
    answers: ["Only if Red (the offending team) gain an advantage"]
    law_reference: "10.5"
    tags: ["offside"]
    law_quote: "A player is accidentally offside if the player cannot avoid being touched by the ball or by a team-mate who is carrying the ball. Only if the offending team gains an advantage should play stop. Sanction: Scrum."
    explanation: "No advantage to the offending team - play on. Advantage gained - scrum, not a penalty, because it was accidental."
    contributor: null

  - id: L10-010
    text: "You stop play for accidental offside. What is the restart?"
    type: sanction
    difficulty: intermediate
    options:
      - "Scrum to the non-offending team"
      - "Penalty"
      - "Free-kick"
      - "Drop-out"
    answers: ["Scrum to the non-offending team"]
    law_reference: "10.5"
    tags: ["offside", "sanction"]
    law_quote: "Sanction: Scrum."
    explanation: "Accidental means no penalty - the scrum simply resets possession fairly."
    contributor: null

  - id: L10-011
    text: "How can an offside player be put onside by the actions of their own team?"
    type: factual
    difficulty: beginner
    options:
      - "By moving behind a team-mate who last played the ball, or behind an onside team-mate"
      - "By standing still for five seconds"
      - "By raising a hand to the referee"
      - "By retreating 5 metres in any direction"
    answers: ["By moving behind a team-mate who last played the ball, or behind an onside team-mate"]
    law_reference: "10.6"
    tags: ["offside"]
    law_quote: "Any offside player can be put onside when that player: moves behind a team-mate who last played the ball; or moves behind a team-mate who is onside."
    explanation: "An onside team-mate can also run PAST the offside player to put them onside (Law 10.7a) - except under the 10-metre law."
    contributor: null

  - id: L10-012
    text: "Other than under the 10-metre law, which opponent action puts an offside player onside?"
    type: factual
    difficulty: advanced
    options:
      - "The opponent kicks the ball, or intentionally touches it without gaining possession"
      - "The opponent tackles the ball-carrier"
      - "The opponent shouts a call"
      - "Nothing an opponent does can put a player onside"
    answers: ["The opponent kicks the ball, or intentionally touches it without gaining possession"]
    law_reference: "10.7b"
    tags: ["offside"]
    law_quote: "An offside player can be put onside when... an opponent of that player: kicks the ball; or intentionally touches the ball without gaining possession of it."
    explanation: "An opponent gaining full possession creates a new 'last played' picture anyway - these clauses cover the kick and the deliberate touch that doesn't stick."
    contributor: null

  - id: L10-013
    text: "A Red player is offside under the 10-metre law. Which opponent action can put them onside?"
    type: factual
    difficulty: advanced
    options:
      - "Only a charge down"
      - "Any touch of the ball by an opponent"
      - "An opponent kicking the ball"
      - "An opponent running 5 metres with the ball"
    answers: ["Only a charge down"]
    law_reference: "10.8"
    tags: ["offside", "10-metre-law"]
    law_quote: "A player offside under Law 10.4c cannot be put onside by any action of an opponent, apart from a charge down."
    explanation: "The 10-metre law is stricter than general offside - the player must physically retire; opponents' touches and kicks do not save them."
    contributor: null

  - id: L10-014
    text: "Red 7 was offside at a ruck which has now ended. How is Red 7 put onside?"
    type: factual
    difficulty: advanced
    options:
      - "By immediately retiring behind the offside line, or when an opponent carries the ball 5m in any direction, or when an opponent kicks"
      - "Automatically, the moment the ruck ends"
      - "By touching an onside team-mate"
      - "Only at the next set-piece"
    answers: ["By immediately retiring behind the offside line, or when an opponent carries the ball 5m in any direction, or when an opponent kicks"]
    law_reference: "10.10"
    tags: ["offside", "ruck"]
    law_quote: "A player who is offside at a ruck, maul, scrum or lineout remains offside, even after the ruck, maul, scrum or lineout has ended. The player can be put onside only if: that player immediately retires behind the applicable offside line; or an opposition player carries the ball five metres in any direction; or an opposition player kicks the ball."
    explanation: "The offside doesn't evaporate when the phase ends - watch retreating defenders who drift back into the passing lane."
    contributor: null

  - id: L10-015
    text: "A retreating offside player delays, then benefits from being put onside in a better position. What is the sanction?"
    type: sanction
    difficulty: advanced
    options:
      - "Penalty"
      - "Free-kick"
      - "Scrum"
      - "No sanction if they eventually retired"
    answers: ["Penalty"]
    law_reference: "10.11a"
    tags: ["offside", "sanction"]
    law_quote: "An offside player may be penalised if that player: fails to retire without undue delay and benefits from being put onside in a more advantageous position; or interferes with play; or moves towards the ball. Sanction: Penalty."
    explanation: "The slow walk back that happens to leave the player perfectly placed - undue delay plus benefit equals penalty."
    contributor: null

  - id: L10-016
    text: "An offside Red player makes no effort to retreat and interferes with play. What is the sanction?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty to Blue"
      - "Free-kick to Blue"
      - "Scrum to Blue"
      - "Play on if Blue keep possession"
    answers: ["Penalty to Blue"]
    law_reference: "10.4a"
    tags: ["offside", "sanction"]
    law_quote: "An offside player may be penalised, if that player: does not make an effort to retreat and interferes with play."
    explanation: "Effort matters - a player genuinely retreating who is unavoidably in the way is a different picture from one who stops trying."
    contributor: null

  - id: L10-017
    text: "A Red player is standing in an offside position but takes no part in play. What do you do?"
    type: factual
    difficulty: intermediate
    options:
      - "Nothing - being offside only becomes an offence through interference"
      - "Penalty immediately"
      - "Free-kick"
      - "Warn the captain"
    answers: ["Nothing - being offside only becomes an offence through interference"]
    law_reference: "10.1"
    tags: ["offside"]
    law_quote: "An offside player must not interfere with play."
    explanation: "But remember loitering counts as interference - a player parked in the defensive line affecting the opposition's options is not 'taking no part'."
    contributor: null

  - id: L10-018
    text: "An offside Red player loiters in the Blue backline's passing channel without touching the ball. What is the sanction?"
    type: sanction
    difficulty: intermediate
    options:
      - "Penalty - loitering is interference"
      - "Nothing - they never played the ball"
      - "Free-kick"
      - "Scrum"
    answers: ["Penalty - loitering is interference"]
    law_reference: "10.1d"
    tags: ["offside", "sanction"]
    law_quote: "An offside player must not interfere with play. This includes... loitering in an offside position."
    explanation: "Loitering changes what the opposition can do even without a touch - that is exactly why it is listed as interference."
    contributor: null

  - id: L10-019
    text: "Which of the following is NOT interference by an offside player?"
    type: factual
    difficulty: intermediate
    options:
      - "Standing still, clearly out of the way, while retreating players pass"
      - "Playing the ball"
      - "Tackling the ball-carrier"
      - "Preventing the opposition from playing as they wish"
    answers: ["Standing still, clearly out of the way, while retreating players pass"]
    law_reference: "10.1"
    tags: ["offside"]
    law_quote: "An offside player must not interfere with play. This includes: playing the ball; tackling the ball-carrier; preventing the opposition from playing as they wish; loitering in an offside position."
    explanation: "The uninvolved offside player commits no offence - your judgement is whether their position affects the opposition's options."
    contributor: null

  - id: L10-020
    text: "Red 10 kicks ahead. Red 7, who was in front of the kicker, keeps chasing and plays the ball. What are Blue's options?"
    type: scenario
    difficulty: intermediate
    options:
      - "Penalty at the place of the offence, or a scrum where Red last played the ball"
      - "Play on - chasing your own kick is always legal"
      - "Scrum only, where the ball was played"
      - "Free-kick at the kick point"
    answers: ["Penalty at the place of the offence, or a scrum where Red last played the ball"]
    law_reference: "10.4c"
    tags: ["offside", "10-metre-law"]
    law_quote: "Sanction: The non-offending team can choose either: penalty at the place of infringement; or scrum where the offending team last played the ball."
    explanation: "Chasing your own kick is only legal for players who were BEHIND the kicker (or put onside). Red 7 started in front and never retired."
    contributor: null
