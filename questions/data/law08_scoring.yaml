  tags:
  - kick
  - conversion
  explanation: null
  contributor: null
- id: L08-036
  text: |-
    At the conversion, where must the opposing team retire to until the kicker begins their approach?
  type: factual
  difficulty: intermediate
  options:
  - Behind the 22m
  - Behind the 5m
  - Behind the try line
  - Behind the dead ball line
  answers:
  - Behind the try line
  law_reference: '8'
  tags:
  - kick
  - conversion
  explanation: null
  contributor: null
- id: L08-037
  text: |-
    At the conversion, in what direction must the kicker move for their approach to the kick to have began?
  type: factual
  difficulty: intermediate
  options:
  - Towards the ball
  - Towards the goal line
  - Towards the touchline
  - Any direction
  answers:
  - Any direction
  law_reference: '8'
  tags:
  - kick
  - conversion
  explanation: null
  contributor: null
- id: L08-038
  text: |-
    At the conversion, after the kicker has began their approach, the opponents may charge. Can they jump to prevent a goal?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  - Yes provided they are not physically supported by other players
