metadata:
  law: 8
  title: Scoring
  source: World Rugby Laws 2026
questions:
- id: L08-001
  text: |-
    At a conversion, the kick took longer than 90 seconds however, the ball rolled over and had to be placed again. Sanction?,
  type: sanction
  difficulty: intermediate
  options:
  - Allow additional time for the kick to be taken
  - The kick is disallowed
  - The kick is disallowed and play is restarted with a free-kick
  - The 90 seconds is reset when the ball rolled over
  answers:
  - The kick is disallowed
  law_reference: '8'
  tags:
  - kick
  - conversion
  - sanction
  explanation: null
  contributor: null
- id: L08-002
  text: At a conversion, the kick was not taken within 90 seconds. Sanction?
  type: sanction
  difficulty: intermediate
  options:
  - Allow additional time for the kick to be taken
  - The kick is disallowed, play restarts as normal
  - The kick is disallowed and play is restarted with a free-kick
  - The kick is disallowed and play is restarted with a penalty
  answers:
  - The kick is disallowed, play restarts as normal
  law_reference: '8'
  tags:
  - kick
  - conversion
  - sanction
  explanation: null
  contributor: null
- id: L08-003
  text: |-
    At a conversion, members of the kicker's team (excluding a team-mate holding the ball) were in front of the kicker. Sanction?
  type: sanction
  difficulty: intermediate
  options:
  - The kick is disallowed
  - The kick is disallowed and play is restarted with a free-kick
  - The kick is disallowed and play is restarted with a penalty
  - The kick is retaken
  answers:
  - The kick is disallowed
  law_reference: '8'
  tags:
  - kick
  - conversion
  - sanction
  explanation: null
  contributor: null
- id: L08-004
  text: |-
    At a conversion, members of the kicker's team misled their opponents into charging too soon. Sanction?
  type: sanction
  difficulty: intermediate
  options:
  - The kick is disallowed
  - The kick is disallowed and play is restarted with a free-kick
  - The kick is disallowed and play is restarted with a penalty
  - The kick is retaken
  answers:
  - The kick is disallowed
  law_reference: '8'
  tags:
  - kick
  - conversion
  - sanction
  explanation: null
  contributor: null
- id: L08-005
  text: |-
    During a conversion attempt, the opposing team shouts but the goal is successful. Sanction?
  type: sanction
  difficulty: intermediate
  options:
  - The score stands
  - The kick is disallowed
  - A retake is awarded as normal
  - A retake is awarded but the opposition must not charge
  answers:
  - The score stands
  law_reference: '8'
  tags:
  - conversion
  - goal
  - sanction
  explanation: null
  contributor: null
- id: L08-006
  text: |-
    During a conversion attempt, the opposing team shouts and the attempt is unsuccessful. Sanction?
  type: sanction
  difficulty: intermediate
  options:
  - The score stands
  - The kick is disallowed
  - A retake is awarded as normal
  - A retake is awarded but the opposition must not charge
  answers:
  - A retake is awarded but the opposition must not charge
  law_reference: '8'
  tags:
  - conversion
  - sanction
  explanation: null
  contributor: null
- id: L08-007
  text: |-
    During a penalty goal attempt, the kicker takes longer than 60 seconds (playing time) to take the kick. Sanction?
  type: sanction
  difficulty: intermediate
  options:
  - The kick is disallowed and a scrum is awarded
  - The kick is disallowed and the penalty is reversed
  - The kick is retaken
  answers:
  - The kick is disallowed and a scrum is awarded
  law_reference: '8'
  tags:
  - kick
  - penalty
  - goal
  - time
  - sanction
  explanation: null
  contributor: null
- id: L08-008
