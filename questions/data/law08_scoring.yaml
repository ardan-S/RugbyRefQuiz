- id: L08-031
  text: |-
    At the conversion, if the ball falls over BEFORE the kicker begins the approach, can the kicker replace it?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'Yes'
  law_reference: '8'
  tags:
  - kick
  - conversion
  explanation: null
  contributor: null
- id: L08-032
  text: |-
    At the conversion, if the ball falls over before the kicker begins the approach and the kicker moves to replace it, can the opponents advance past the goal line?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'No'
  law_reference: '8'
  tags:
  - kick
  - conversion
  - goal
  explanation: null
  contributor: null
- id: L08-033
  text: |-
    At the conversion, if the ball falls over AFTER the kicker begins the approach, what may the kicker do?
  type: factual
  difficulty: intermediate
  options:
  - Replace the ball
  - Kick or attempt a dropped goal
  - Nothing, the kick is disallowed
  - Kick the ball where it landed
  answers:
  - Kick or attempt a dropped goal
  law_reference: '8'
  tags:
  - kick
  - conversion
  explanation: null
  contributor: null
- id: L08-034
  text: |-
    At the conversion, if the ball falls over and rolls away from the line through the place where the try was awarded, and the kicker kicks the ball over the crossbar, is the conversion successful?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'Yes'
  law_reference: '8'
  tags:
  - kick
  - try
  - conversion
  explanation: null
  contributor: null
- id: L08-035
  text: |-
    At the conversion, what are the options for the kicker if the ball falls over and rolls into touch after the kicker begins their approach?
  type: factual
  difficulty: intermediate
  options:
  - Kick the ball where it landed
  - Replace the ball
  - Kick or attempt a dropped goal
  - Nothing, the kick is disallowed
