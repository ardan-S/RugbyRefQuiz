  explanation: null
  contributor: null
- id: L08-023
  text: |-
    Is a conversion successful if it goes over the crossbar and over the height of the goal posts but it is deemed that it would have gone between the goal posts had they been taller?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
