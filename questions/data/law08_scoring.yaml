metadata:
  law: 8
  title: Scoring
  source: World Rugby Laws 2026
questions:
- id: L08-001
  text: At a conversion the ball falls over and is replaced, and the kick is finally
    struck 70 seconds after the try was awarded. What do you do?
  type: sanction
  difficulty: intermediate
  options:
  - Disallow the kick - the 60 seconds is not extended when the ball rolls over
  - Allow it - the clock reset when the ball was replaced
  - Allow it - conversions have 90 seconds
  - Award a free-kick to the defending team
  answers:
  - Disallow the kick - the 60 seconds is not extended when the ball rolls over
  law_reference: 8.8c
  tags:
  - conversion
  - time
  - sanction
  law_quote: 'Takes the kick within 60 seconds (playing time) from the time the
    try was awarded, even if the ball rolls over and has to be placed again. Sanction:
    Kick is disallowed.'
  explanation: 60 seconds of playing time from the award of the try, no extensions.
    Play restarts as if the conversion had been declined or missed.
  contributor: null
- id: L08-003
  text: At a conversion, a member of the kicker's team (not the placer) stands in
    front of the ball as it is kicked. Sanction?
  type: sanction
  difficulty: intermediate
  options:
  - The kick is disallowed
  - Penalty to the opposing team
  - The kick is retaken
  - No sanction - only opponents are constrained
  answers:
  - The kick is disallowed
  law_reference: '8.9'
  tags:
  - conversion
  - sanction
  law_quote: 'The kicker''s team, apart from a team-mate holding the ball, stay
    behind the ball when it is kicked and do nothing to mislead their opponents into
    charging too soon. Sanction: Kick is disallowed.'
  explanation: The same sanction covers misleading opponents into charging too soon
    - dummy runs and false starts by the kicking team kill the kick.
  contributor: null
- id: L08-005
  text: The defending team shouts during a conversion attempt, but the kick is successful.
    What do you do?
  type: sanction
  difficulty: intermediate
  options:
  - The goal stands
  - Disallow the goal and order a retake
  - The goal stands and you award a penalty at half-way
  - Order a retake with no charge allowed
  answers:
  - The goal stands
  law_reference: '8.15'
  tags:
  - conversion
  - sanction
  law_quote: 'Sanction: If the opposing team at a conversion attempt infringes but
    the kick is successful, the goal stands.'
  explanation: A successful kick cures the infringement - no retake, no further
    sanction.
  contributor: null
- id: L08-006
  text: The defending team shouts during a conversion attempt and the kick misses.
    What do you do?
  type: sanction
  difficulty: intermediate
  options:
  - The kicker retakes, and the opposing team may not charge
  - The miss stands - play on
  - Award a penalty on the 22
  - Retake with the charge allowed as normal
  answers:
  - The kicker retakes, and the opposing team may not charge
  law_reference: '8.15'
  tags:
  - conversion
  - sanction
  law_quote: If the kick is unsuccessful, the kicker retakes the conversion and
    the opposing team is not allowed to charge. When another kick is allowed, the
    kicker may repeat all the preparations. The kicker may change the type of kick.
  explanation: On the retake the kicker gets full preparations again and may even
    switch between place-kick and drop-kick.
  contributor: null
- id: L08-007
  text: A team indicates a kick at goal from a penalty but takes 70 seconds to strike
    it. Sanction?
  type: sanction
  difficulty: intermediate
  options:
  - Kick disallowed and a scrum is awarded
  - Kick disallowed, penalty retaken as a tap
  - Kick disallowed, free-kick to the opposition
  - Allow the goal if successful - timing is advisory
  answers:
  - Kick disallowed and a scrum is awarded
  law_reference: '8.21'
  tags:
  - penalty
  - time
  - sanction
  law_quote: 'The kick must be taken within 60 seconds (playing time) from the time
    the team indicated their intention to do so, even if the ball rolls over and
    has to be placed again. Sanction: Kick is disallowed and a scrum is awarded.'
  explanation: Note the difference from a slow conversion (kick simply disallowed)
    - a slow penalty kick at goal costs possession too, via the scrum.
  contributor: null
- id: L08-008
  text: How many points is a try worth?
  type: factual
  difficulty: beginner
  options:
  - '5'
  - '4'
  - '6'
  - '7'
  answers:
  - '5'
  law_reference: 8.1a
  tags:
  - try
  law_quote: 'Try. Five points.'
  explanation: null
  contributor: null
- id: L08-009
  text: How many points is a conversion worth?
  type: factual
  difficulty: beginner
  options:
  - '2'
  - '3'
  - '1'
  - '5'
  answers:
  - '2'
  law_reference: 8.1b
  tags:
  - conversion
  law_quote: 'Conversion. Two points.'
  explanation: null
  contributor: null
- id: L08-010
  text: How many points is a penalty try worth?
  type: factual
  difficulty: beginner
  options:
  - '7'
  - '5'
  - '3'
  - 5, plus the conversion attempt
  answers:
  - '7'
  law_reference: 8.1c
  tags:
  - try
  - penalty
  law_quote: 'Penalty try. Seven points.'
  explanation: Seven points flat - no conversion is attempted after a penalty try.
  contributor: null
- id: L08-011
  text: How many points is a penalty goal worth?
  type: factual
  difficulty: beginner
  options:
  - '3'
  - '2'
  - '5'
  - '1'
  answers:
  - '3'
  law_reference: 8.1d
  tags:
  - penalty
  - goal
  law_quote: 'Penalty goal. Three points.'
  explanation: null
  contributor: null
- id: L08-012
  text: How many points is a dropped goal worth?
  type: factual
  difficulty: beginner
  options:
  - '3'
  - '2'
  - '5'
  - '4'
  answers:
  - '3'
  law_reference: 8.1e
  tags:
  - goal
  law_quote: 'Dropped goal. Three points.'
  explanation: null
  contributor: null
- id: L08-013
  text: Which of these is NOT a try?
  type: factual
  difficulty: intermediate
  options:
  - An attacking player touches the ball down on the opponents' dead-ball line
  - An attacking player is first to ground the ball in the opponents' in-goal
  - An attacker is first to ground the ball when a scrum reaches the try line
  - A tackled player near the try line immediately reaches out and grounds the ball
  answers:
  - An attacking player touches the ball down on the opponents' dead-ball line
  law_reference: '8.2'
  tags:
  - try
  - in-goal
  law_quote: 'A try is scored when an attacking player: is first to ground the ball
    in the opponents'' in-goal; is first to ground the ball when a scrum, ruck or
    maul reaches the try line; is tackled near to the opponents'' try line and the
    player immediately reaches out and grounds the ball...'
  explanation: The dead-ball line is not part of in-goal - ball or ball-carrier
    touching it (or beyond) makes the ball dead.
  contributor: null
- id: L08-014
  text: Red 12 is tackled short of the try line but momentum slides them, in one
    continuous movement along the ground, into in-goal where they ground the ball.
    What do you award?
  type: scenario
  difficulty: intermediate
  options:
  - Try
  - Held up - 5m scrum to the attacking team
  - Penalty to Blue for double movement
  - Drop-out to Blue
  answers:
  - Try
  law_reference: 8.2c
  tags:
  - try
  - tackle
  law_quote: With the ball is tackled short of the try line and the player's momentum
    carries them in a continuous movement along the ground into the opponents' in-goal,
    and the player is first to ground the ball.
  explanation: The test is ONE continuous movement. A stop followed by a second
    lunge is not momentum - but a tackled player near the line may legally reach
    out and ground (Law 8.2d).
  contributor: null
- id: L08-015
  text: Red 11 is standing in touch-in-goal. The ball is loose on the ground in Blue's
    in-goal, and Red 11 presses it down without holding it. What do you award?
  type: scenario
  difficulty: advanced
  options:
  - Try - a player in touch may ground a ball they are not holding
  - No try - Red 11 is out of play
  - Scrum 5m to Red
  - Touch-in-goal - drop-out to Blue
  answers:
  - Try - a player in touch may ground a ball they are not holding
  law_reference: 8.2e
  tags:
  - try
  - in-goal
  law_quote: '[A try is scored when an attacking player] who is in touch or touch-in-goal,
    grounds the ball in the opponents'' in-goal provided the player is not holding
    the ball.'
  explanation: The ball must be in in-goal and the player must NOT be holding it
    - pressing down a loose ball scores even with the feet in touch.
  contributor: null
- id: L08-016
  text: Where is a penalty try awarded?
  type: factual
  difficulty: beginner
  options:
  - Between the goal posts
  - Where the foul play occurred
  - Where the probable try would have been scored
  - On the 5-metre line
  answers:
  - Between the goal posts
  law_reference: '8.3'
  tags:
  - try
  - penalty
  law_quote: A penalty try is awarded between the goal posts if foul play by the
    opposing team prevents a probable try from being scored, or scored in a more
    advantageous position.
  explanation: null
  contributor: null
- id: L08-017
  text: When is a penalty try awarded?
  type: sanction
  difficulty: intermediate
  options:
  - When foul play prevents a probable try, or prevents one being scored in a more
    advantageous position
  - Whenever foul play occurs in in-goal
  - When any infringement prevents a probable try
  - When a defending team concedes three penalties in their 22
  answers:
  - When foul play prevents a probable try, or prevents one being scored in a more
    advantageous position
  law_reference: '8.3'
  tags:
  - try
  - penalty
  - foul-play
  law_quote: A penalty try is awarded between the goal posts if foul play by the
    opposing team prevents a probable try from being scored, or scored in a more
    advantageous position.
  explanation: Two tests - FOUL PLAY (not just any offence) and a PROBABLE try.
    Repeated ordinary infringements are managed with cards, not penalty tries.
  contributor: null
- id: L08-018
  text: Is a conversion attempted after a penalty try?
  type: factual
  difficulty: beginner
  options:
  - No - the penalty try is worth 7 points with no conversion
  - Yes, from in front of the posts
  - Yes, from where the foul play occurred
  - Only if the captain requests it
  answers:
  - No - the penalty try is worth 7 points with no conversion
  law_reference: '8.3'
  tags:
  - try
  - penalty
  - conversion
  law_quote: No conversion is attempted.
  explanation: Play restarts at half-way. Remember also that no water carriers may
    enter at a penalty try (Law 6.29).
  contributor: null
- id: L08-019
  text: You award a penalty try. What must happen to the offending player?
  type: sanction
  difficulty: intermediate
  options:
  - They must be cautioned and shown a yellow card, or sent off
  - Nothing further - the 7 points are the sanction
  - They must always be sent off
  - A team warning is sufficient
  answers:
  - They must be cautioned and shown a yellow card, or sent off
  law_reference: '8.3'
  tags:
  - try
  - penalty
  - foul-play
  - suspension
  law_quote: A player guilty of this must be cautioned and shown a yellow card or
    sent off.
  explanation: The card is mandatory with a penalty try - the minimum is yellow.
  contributor: null
- id: L08-020
  text: For any goal to be successful, the ball must go over the crossbar and between
    the posts without first touching what?
  type: factual
  difficulty: intermediate
  options:
  - A team-mate or the ground
  - Any player or the ground
  - Anything at all, including the posts
  - The ground only
  answers:
  - A team-mate or the ground
  law_reference: '8.4'
  tags:
  - goal
  - kick
  law_quote: For any goal to be successful, the ball must be kicked over the crossbar
    and between the goal posts without first touching a team-mate or the ground.
  explanation: An OPPONENT touching the ball does not void the goal - if it still
    goes over, the goal stands (Law 8.17).
  contributor: null
- id: L08-023
  text: A kick at goal sails higher than the tops of the posts, above the gap. Is
    the goal good?
  type: factual
  difficulty: intermediate
  options:
  - Yes, if the ball would have passed between the posts had they been taller
  - No - the ball must pass below the height of the posts
  - Only if an assistant is level with the posts
  - It must be retaken
  answers:
  - Yes, if the ball would have passed between the posts had they been taller
  law_reference: '8.5'
  tags:
  - goal
  - kick
  law_quote: If the ball goes over the crossbar and over the height of the goal
    posts, the kick is successful if it is deemed that the ball would have gone between
    the goal posts had they been taller.
  explanation: This is what the officials behind the posts are judging - the projected
    line of the posts extended upwards.
  contributor: null
- id: L08-024
  text: A kick crosses the crossbar but the wind blows the ball back into the field
    of play. What is the decision?
  type: factual
  difficulty: intermediate
  options:
  - The score stands
  - No goal - the ball must land beyond the dead-ball line
  - The kick is retaken
  - Play on - the ball is live
  answers:
  - The score stands
  law_reference: '8.6'
  tags:
  - goal
  - kick
  law_quote: If the ball has crossed the crossbar and the wind blows it back into
    the field of play, the score stands.
  explanation: The moment the ball crosses the bar between the posts, the goal is
    scored - what happens after is irrelevant.
  contributor: null
- id: L08-025
  text: What type of kick may a conversion be?
  type: factual
  difficulty: beginner
  options:
  - A place-kick or a drop-kick
  - A place-kick only
  - A drop-kick only
  - Any kick, including a punt
  answers:
  - A place-kick or a drop-kick
  law_reference: '8.7'
  tags:
  - conversion
  - kick
  law_quote: When a try is scored, it gives that team the right to attempt a conversion,
    which may be a place-kick or drop-kick.
  explanation: A punt is never a kick at goal - no goal can be scored from a punt.
  contributor: null
- id: L08-028
  text: Where must a conversion be taken?
  type: factual
  difficulty: intermediate
  options:
  - In the field of play, on a line through the place where the try was awarded,
    parallel to the touchlines
  - Anywhere behind the 22-metre line
  - In line with the posts
  - Anywhere on a line through where the ball was grounded, including in-goal
  answers:
  - In the field of play, on a line through the place where the try was awarded,
    parallel to the touchlines
  law_reference: 8.8a
  tags:
  - conversion
  - kick
  law_quote: Takes the kick in the field of play on a line through the place where
    the try was awarded, parallel to the touchlines.
  explanation: This is why scoring near the posts matters - the line of the kick
    is set by where the try was awarded, not where the kicker prefers.
  contributor: null
- id: L08-029
  text: What may the ball be placed on for a conversion?
  type: factual
  difficulty: intermediate
  options:
  - The ground, sand, sawdust or a kicking tee
  - A kicking tee only
  - Anything that raises it no more than 10cm
  - The ground or a tee, but never sand
  answers:
  - The ground, sand, sawdust or a kicking tee
  law_reference: 8.8b
  tags:
  - conversion
  - kick
  law_quote: Places the ball directly on the ground or on sand, sawdust, or a kicking
    tee. The kicker may be assisted by a placer. Nothing else may be used to assist
    the kicker.
  explanation: A placer is the only human help allowed; nothing else may assist
    the kicker.
  contributor: null
- id: L08-031
  text: At a conversion, the ball falls over BEFORE the kicker begins the approach.
    What happens?
  type: procedural
  difficulty: intermediate
  options:
  - The referee permits the kicker to replace it; opponents remain behind their
    try line
  - The kicker must play it as it lies
  - The kick is disallowed
  - The opponents may charge while it is replaced
  answers:
  - The referee permits the kicker to replace it; opponents remain behind their
    try line
  law_reference: '8.10'
  tags:
  - conversion
  - kick
  law_quote: If the ball falls over before the kicker begins the approach to kick,
    the referee permits the kicker to replace it. While the ball is replaced, the
    opponents remain behind their try line.
  explanation: null
  contributor: null
- id: L08-033
  text: At a conversion, the ball falls over AFTER the kicker begins the approach.
    What may the kicker do?
  type: procedural
  difficulty: advanced
  options:
  - Kick the ball as it lies, or attempt a dropped goal
  - Stop and replace the ball
  - Nothing - the kick is disallowed
  - Ask the referee to restart the 60 seconds
  answers:
  - Kick the ball as it lies, or attempt a dropped goal
  law_reference: '8.11'
  tags:
  - conversion
  - kick
  law_quote: If the ball falls over after the kicker begins the approach to kick,
    the kicker may then kick or attempt a dropped goal.
  explanation: And the opponents may keep charging (Law 8.16). If the fallen ball
    rolls into touch, the kick is disallowed (Law 8.13); if it just rolls off the
    line and is kicked over, the goal counts (Law 8.12).
  contributor: null
- id: L08-035
  text: At a conversion, the ball falls over after the approach begins and rolls
    into touch. What happens?
  type: procedural
  difficulty: advanced
  options:
  - The kick is disallowed
  - The kicker retrieves it and kicks from touch
  - The ball is replaced and the kick retaken
  - A scrum is awarded where the ball crossed the touchline
  answers:
  - The kick is disallowed
  law_reference: '8.13'
  tags:
  - conversion
  - kick
  law_quote: If the ball falls over and rolls into touch after the kicker begins
    the approach to kick, the kick is disallowed.
  explanation: Contrast - rolling AWAY from the line but staying in play still allows
    a successful kick (Law 8.12); rolling into touch ends the attempt.
  contributor: null
- id: L08-036
  text: At a conversion, where must the opposing team be until the kicker begins
    the approach?
  type: factual
  difficulty: intermediate
  options:
  - Behind their own try line, not overstepping it
  - Behind the 5-metre line
  - Behind the 22-metre line
  - Behind the dead-ball line
  answers:
  - Behind their own try line, not overstepping it
  law_reference: '8.14'
  tags:
  - conversion
  law_quote: All players retire to their try line and do not overstep that line
    until the kicker moves in any direction to begin their approach to kick.
  explanation: null
  contributor: null
- id: L08-037
  text: What movement by the kicker releases the defending team to charge a conversion?
  type: factual
  difficulty: advanced
  options:
  - The kicker moving in ANY direction to begin the approach
  - Only movement towards the ball
  - The kicker's first step forward
  - The referee's signal
  answers:
  - The kicker moving in ANY direction to begin the approach
  law_reference: '8.14'
  tags:
  - conversion
  law_quote: All players retire to their try line and do not overstep that line
    until the kicker moves in any direction to begin their approach to kick. When
    the kicker does this, they may charge or jump to prevent a goal but must not
    be physically supported by other players in these actions.
  explanation: A sideways shuffle or a step back counts - any movement to begin
    the approach opens the charge.
  contributor: null
- id: L08-038
  text: Charging defenders jump to block a conversion, boosting a team-mate upwards.
    Is this legal?
  type: factual
  difficulty: intermediate
  options:
  - No - players may charge or jump but must not be physically supported by others
  - Yes - any means of blocking the kick is legal
  - No - jumping is banned at conversions entirely
  - Only the two players nearest the posts may jump
  answers:
  - No - players may charge or jump but must not be physically supported by others
  law_reference: '8.14'
  tags:
  - conversion
  law_quote: They may charge or jump to prevent a goal but must not be physically
    supported by other players in these actions.
  explanation: null
  contributor: null
- id: L08-042
  text: A charging defender gets fingertips to a conversion, but the ball still goes
    over between the posts. What is the decision?
  type: factual
  difficulty: intermediate
  options:
  - The goal stands
  - No goal - the ball was touched in flight
  - The kick is retaken
  - Penalty to the kicking team
  answers:
  - The goal stands
  law_reference: '8.17'
  tags:
  - conversion
  - goal
  law_quote: If the opposition touches the ball and the kick is successful, the
    goal stands.
  explanation: Only a TEAM-MATE or the ground touching the ball voids a goal (Law
    8.4) - opposition touches never do.
  contributor: null
- id: L08-043
  text: From which award can a penalty goal be scored?
  type: factual
  difficulty: beginner
  options:
  - Only from a penalty
  - From a penalty or a free-kick
  - From any stoppage inside the 22
  - From a mark
  answers:
  - Only from a penalty
  law_reference: '8.18'
  tags:
  - penalty
  - goal
  law_quote: A penalty goal can be scored only from a penalty.
  explanation: No goal can be scored from a free-kick - and after a free-kick, even
    a drop-goal is restricted until the ball is next dead or an opponent has played
    it (Law 8.29).
  contributor: null
- id: L08-044
  text: How quickly must a team indicate their intention to kick at goal from a penalty?
  type: factual
  difficulty: intermediate
  options:
  - Without delay
  - Within 30 seconds
  - Within 60 seconds
  - Before the opposition sets its line
  answers:
  - Without delay
  law_reference: '8.19'
  tags:
  - penalty
  - goal
  law_quote: The kicking team must indicate their intention to kick for goal without
    delay.
  explanation: Once indicated, the 60-second clock to strike the kick begins (Law
    8.21).
  contributor: null
- id: L08-045
  text: Red signal for the tee after a penalty, then decide they would rather tap
    and run. What do you rule?
  type: sanction
  difficulty: intermediate
  options:
  - They must kick at goal - the indicated intention is binding
  - They may change their mind before the tee arrives
  - They may tap, but only from 10m further back
  - Free-kick to Blue for time-wasting
  answers:
  - They must kick at goal - the indicated intention is binding
  law_reference: '8.20'
  tags:
  - penalty
  - goal
  law_quote: 'If the team indicates to the referee the intention to kick at goal,
    they must kick at goal. The intention to kick can be communicated to the referee
    or signalled by the arrival of the kicking tee or sand, or when the player makes
    a mark on the ground. Sanction: Kick is disallowed and a scrum is awarded.'
  explanation: The tee arriving IS an indication, even without a word to you - manage
    this early ("are you kicking for goal?").
  contributor: null
- id: L08-046
  text: Which of these does NOT count as indicating an intention to kick at goal?
  type: factual
  difficulty: advanced
  options:
  - The ball being handed to the recognised goal-kicker
  - Telling the referee
  - The arrival of the kicking tee or sand
  - The player making a mark on the ground
  answers:
  - The ball being handed to the recognised goal-kicker
  law_reference: '8.20'
  tags:
  - penalty
  - goal
  law_quote: The intention to kick can be communicated to the referee or signalled
    by the arrival of the kicking tee or sand, or when the player makes a mark on
    the ground.
  explanation: null
  contributor: null
- id: L08-047
  text: Once a team indicates a kick at goal from a penalty, how long do they have
    to take it?
  type: factual
  difficulty: intermediate
  options:
  - 60 seconds (playing time) from the indication
  - 90 seconds from the indication
  - 60 seconds from when the tee arrives
  - 30 seconds from the referee's mark
  answers:
  - 60 seconds (playing time) from the indication
  law_reference: '8.21'
  tags:
  - penalty
  - goal
  - time
  law_quote: The kick must be taken within 60 seconds (playing time) from the time
    the team indicated their intention to do so, even if the ball rolls over and
    has to be placed again.
  explanation: Same 60 seconds as a conversion - but the sanction here is harsher
    (kick disallowed AND scrum).
  contributor: null
- id: L08-048
  text: During a penalty kick at goal the ball falls off the tee and must be replaced.
    What happens to the 60 seconds?
  type: factual
  difficulty: advanced
  options:
  - Nothing - the time is not extended
  - The clock resets
  - 30 extra seconds are allowed
  - The referee decides how much extra to allow
  answers:
  - Nothing - the time is not extended
  law_reference: '8.21'
  tags:
  - penalty
  - goal
  - time
  law_quote: The kick must be taken within 60 seconds (playing time) from the time
    the team indicated their intention to do so, even if the ball rolls over and
    has to be placed again.
  explanation: null
  contributor: null
- id: L08-049
  text: What must the defending team do while a penalty kick at goal is taken?
  type: factual
  difficulty: intermediate
  options:
  - Stand still with their hands by their sides from the kicker's approach until
    the ball is kicked
  - Retire to the try line and then charge
  - Stand behind the posts
  - Turn their backs to the kicker
  answers:
  - Stand still with their hands by their sides from the kicker's approach until
    the ball is kicked
  law_reference: '8.22'
  tags:
  - penalty
  - goal
  law_quote: If the kicker indicates to the referee the intent to kick at goal,
    the opposing team must stand still with their hands by their sides from the time
    the kicker starts to approach to kick until the ball is kicked.
