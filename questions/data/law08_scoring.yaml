- id: L08-053
  text: Red are awarded a free-kick, tap it, and on the next phase their 10 drops
    a goal. No Blue player has touched the ball. What do you rule?
  type: scenario
  difficulty: advanced
  options:
  - No goal - the kick is deemed unsuccessful and play continues
  - The goal stands - 3 points
  - Scrum to Blue where the kick was taken
  - The free-kick is retaken
  answers:
  - No goal - the kick is deemed unsuccessful and play continues
  law_reference: '8.29'
  tags:
  - goal
  - free-kick
  law_quote: The team awarded a free-kick (including where they opt for a lineout
    instead) cannot score a dropped goal until the ball next becomes dead or until
    an opponent has played the ball, has touched it or has tackled the ball-carrier.
    Any such kick is deemed to be unsuccessful and play continues.
  explanation: The restriction also applies when the team chooses a lineout from
    the free-kick. An opponent playing or touching the ball, a tackle, or a dead
    ball resets the right to drop for goal.
  contributor: null
