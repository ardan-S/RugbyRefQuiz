  explanation: null
  contributor: null
- id: L08-026
  text: When does a team have the right to attempt a conversion?
  type: factual
  difficulty: intermediate
  options:
  - After a try has been scored
  - After a penalty try has been awarded
  - After a penalty goal has been awarded
  - After a drop goal has been scored
  answers:
  - After a try has been scored
  law_reference: '8'
  tags:
  - conversion
  explanation: null
  contributor: null
- id: L08-027
  text: |-
    At a conversion, must the kicker use the ball that was in play when the try was scored?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  - Yes provided the ball is not defective
  answers:
  - Yes provided the ball is not defective
