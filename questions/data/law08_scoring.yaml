  - conversion
  explanation: null
  contributor: null
- id: L08-028
  text: |-
    From the following options, where must a conversion be taken?
    1. In the field of play
    2. Through the place where the try was awarded parallel to the touch lines
    3. Behind the 5m line
    4. Within the 15m lines
  type: factual
  difficulty: advanced
  options:
  - 1, 2 and 3
  - 1, 2 and 4
  - 1 and 2
  - 1 and 3
  answers:
  - 1 and 2
  law_reference: '8'
  tags:
  - try
  - conversion
  explanation: null
  contributor: null
- id: L08-029
  text: What is the ball NOT permitted to be placed on when taking a conversion?
  type: factual
  difficulty: intermediate
  options:
  - A kicking tee
  - A mound of sand
  - A mound of sawdust
  - A mound of rubber
