- id: L08-013
  text: Which of these does NOT result in a try?
  type: factual
  difficulty: intermediate
  options:
  - A player is the first to ground the ball in the opponents' in-goal
  - |-
    A player is the first to ground the ball when a scrum, ruck or maul reaches the goal line
  - |-
    A player is tackled near to the opponents' goal line and the player immediately reaches out and grounds the ball
  - A player touches the ball down on the opponents' dead-ball line
  answers:
  - A player touches the ball down on the opponents' dead-ball line
  law_reference: '8'
  tags:
  - try
  explanation: null
  contributor: null
- id: L08-014
  text: |-
    If a player is tackled short of the goal line, can their momentum carry them (in a continuous movement) into in-goal where they ground the ball
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'Yes'
  law_reference: '8'
  tags:
  - tackle
  - goal
  explanation: null
  contributor: null
- id: L08-015
  text: |-
    Can a player who is in touch or touch-in-goal ground the ball in the opponents' in-goal?
  type: factual
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  - Yes provided the player is not holding the ball
  - Yes provided the ball is moving
  answers:
  - Yes provided the player is not holding the ball
  law_reference: '8'
  tags:
  - goal
  explanation: null
  contributor: null
- id: L08-016
  text: Where is a penalty try awarded
  type: sanction
  difficulty: intermediate
  options:
  - Under the posts
  - At the place of infringement
  - At the touchline
  - At the place where the ball was last played
  answers:
  - Under the posts
  law_reference: '8'
  tags:
  - penalty
  - try
  explanation: null
  contributor: null
- id: L08-017
  text: When can a penalty try be awarded? (2 correct answers)
  type: sanction
  difficulty: advanced
  options:
  - If foul play by the opposing team prevents a probable try from being scored
  - |-
    If foul play by the opposing team prevents a probable try from being scored in a more advantageous position
  - If a legal act prevents a try from being scored in a more advantageous position
  - If an act of foul play takes place in in-goal
  answers:
  - If foul play by the opposing team prevents a probable try from being scored
  - |-
    If foul play by the opposing team prevents a probable try from being scored in a more advantageous position
  law_reference: '8'
  tags:
  - penalty
  - try
  explanation: null
  contributor: null
- id: L08-018
  text: Is a conversion attempted following a penalty try?
  type: sanction
  difficulty: intermediate
  options:
  - 'Yes'
  - 'No'
  answers:
  - 'No'
  law_reference: '8'
  tags:
  - penalty
  - try
  - conversion
  explanation: null
  contributor: null
- id: L08-019
  text: |-
    True or false: A player guilty of foul play which results in the award of a penalty try MUST be cautioned and temporarily suspended or sent off
  type: sanction
  difficulty: beginner
  options:
  - 'True'
  - 'False'
  answers:
  - 'True'
  law_reference: '8'
  tags:
  - penalty
  - try
  - foul-play
  - sending-off
  explanation: null
  contributor: null
- id: L08-020
  text: |-
    Is a conversion successful if it touches a team-mate before passing over the crossbar and between the goal posts?
