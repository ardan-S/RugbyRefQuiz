<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rugby Ref Quiz{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --pico-font-size: 100%;
        }
        body {
            background-color: #e6f3ff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .quiz-container {
            min-height: 400px;
        }
        .feedback-correct {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .feedback-wrong {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .error-message {
            color: #dc3545;
            margin-bottom: 1rem;
        }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            background-color: #f8f9fa;
            border-radius: 0.5rem;
        }
        .progress-details {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .end-now-button {
            margin-bottom: 0;
            white-space: nowrap;
        }
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
        fieldset {
            border: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        fieldset label {
            display: flex;
            align-items: flex-start;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            max-width: 500px;
        }
        fieldset label input[type="checkbox"] {
            margin-top: 0.2rem;
        }
        fieldset label:hover {
            background-color: #f8f9fa;
        }
        fieldset input[type="radio"],
        fieldset input[type="checkbox"] {
            margin-right: 0.75rem;
        }
        .select-all-label {
            background-color: #e9ecef;
        }
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            width: 100%;
            max-width: 500px;
        }
        .button-group a {
            margin: 0;
        }
        .button-group > * {
            flex: 1 1 0;
            margin-bottom: 0;
            text-align: center;
        }
        fieldset hr {
            margin: 0.5rem 0;
            width: 100%;
            max-width: 500px;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        form > button {
            max-width: 500px;
        }
        fieldset .law-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .law-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-auto-rows: 112px;
            gap: 0.75rem;
            width: 100%;
            max-width: 960px;
        }
        .law-grid > .law-card {
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1.1rem minmax(0, 1fr);
            column-gap: 0.75rem;
            align-content: start;
            align-items: start;
            align-self: stretch;
            justify-self: stretch;
            width: 100%;
            min-width: 0;
            min-height: 112px;
            height: 112px;
            max-height: 112px;
            margin-bottom: 0;
            padding: 0.9rem 1rem;
        }
        .law-grid > .law-card input[type="checkbox"] {
            flex: 0 0 auto;
            width: 1.1rem;
            height: 1.1rem;
            min-width: 1.1rem;
            min-height: 1.1rem;
            margin: 0.15rem 0 0 0;
        }
        .law-grid > .law-card .law-info {
            min-width: 0;
            width: 100%;
        }
        .law-grid > .law-card .law-name {
            display: block;
        }
        .count-fieldset {
            width: 100%;
        }
        .count-grid {
            display: grid;
            gap: 0.75rem;
            width: 100%;
            max-width: 500px;
        }
        .count-grid > .count-card {
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1.1rem minmax(0, 1fr);
            column-gap: 0.75rem;
            align-content: center;
            align-items: center;
            width: 100%;
            min-height: 72px;
            height: 72px;
            max-width: none;
            margin-bottom: 0;
            padding: 0.9rem 1rem;
        }
        .count-grid > .count-card input[type="radio"] {
            width: 1.1rem;
            height: 1.1rem;
            min-width: 1.1rem;
            min-height: 1.1rem;
            margin: 0;
        }
        .count-card-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            width: 100%;
        }
        .count-card-content input[type="number"] {
            width: 140px;
            margin: 0;
        }
        fieldset .law-info .question-count {
            color: #6c757d;
            font-size: 0.85em;
        }
        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .badges {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: capitalize;
            white-space: nowrap;
        }
        .badge-law {
            background-color: #e2e8f5;
            color: #2c3e6b;
        }
        .badge-type {
            background-color: #e9ecef;
            color: #495057;
        }
        .badge-beginner {
            background-color: #d4edda;
            color: #1e6b33;
        }
        .badge-intermediate {
            background-color: #fff3cd;
            color: #7a5c00;
        }
        .badge-advanced {
            background-color: #f8d7da;
            color: #842029;
        }
        .law-detail {
            background-color: #f0f4fa;
            border-left: 4px solid #2c3e6b;
            padding: 0.75rem 1rem;
            border-radius: 0 0.5rem 0.5rem 0;
            margin-bottom: 1rem;
        }
        .law-detail p {
            margin-bottom: 0.25rem;
        }
        .law-detail .law-ref {
            color: #2c3e6b;
        }
        .filters-fieldset {
            width: 100%;
            max-width: 960px;
            margin-top: 1rem;
        }
        .filters-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            width: 100%;
        }
        .review-item {
            margin-bottom: 1rem;
        }
        .review-badges {
            margin-bottom: 0.5rem;
        }
        .review-your-answer {
            color: #842029;
            margin-bottom: 0.25rem;
        }
        .review-correct-answer {
            color: #1e6b33;
        }
        .results-buttons form {
            display: block;
        }
        .results-buttons form button {
            width: 100%;
            margin-bottom: 0;
        }
        @media (max-width: 900px) {
            .law-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        @media (max-width: 640px) {
            .law-grid {
                grid-template-columns: 1fr;
            }
            .progress-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .end-now-button {
                text-align: center;
            }
            .filters-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>Rugby Ref Quiz</h1>
        </header>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
