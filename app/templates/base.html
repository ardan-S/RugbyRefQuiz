<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rugby Ref Quiz{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        /* Pitch-green theme: overrides daisyUI's light theme variables */
        :root, [data-theme="light"] {
            --color-base-100: #ffffff;
            --color-base-200: #f3f4ee;
            --color-base-300: #e2e5db;
            --color-base-content: #1d2a23;
            --color-primary: #1b5e3b;
            --color-primary-content: #ffffff;
            --color-secondary: #37584a;
            --color-secondary-content: #ffffff;
            --color-accent: #2e8b57;
            --color-accent-content: #ffffff;
            --color-success: #1e7f4f;
            --color-success-content: #ffffff;
            --color-error: #b3372f;
            --color-error-content: #ffffff;
            --color-warning: #a8720a;
            --color-warning-content: #ffffff;
            --color-info: #2b6cb0;
            --color-info-content: #ffffff;
            --radius-box: 0.75rem;
            --radius-field: 0.5rem;
        }
        body {
            font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
        }

        /* Selectable cards (topics, laws, counts): highlight when checked */
        .pick-card {
            display: block;
            height: 100%;
            border: 1.5px solid var(--color-base-300);
            border-radius: var(--radius-box);
            background: var(--color-base-100);
            padding: 0.85rem 1rem;
            cursor: pointer;
            transition: border-color .15s, background-color .15s, box-shadow .15s;
        }
        .pick-card:hover {
            border-color: var(--color-accent);
        }
        label:has(> input:checked) > .pick-card {
            border-color: var(--color-primary);
            background: color-mix(in oklab, var(--color-primary) 7%, white);
            box-shadow: 0 0 0 1px var(--color-primary);
        }
        .pick-check {
            visibility: hidden;
            color: var(--color-primary);
            font-weight: 800;
        }
        label:has(> input:checked) .pick-check {
            visibility: visible;
        }

        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="min-h-screen bg-base-200 text-base-content flex flex-col">
    <header class="bg-primary text-primary-content shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="{{ url_for('main.index') }}" class="flex items-center gap-2 no-underline text-primary-content">
                <span class="text-2xl">🏉</span>
                <span>
                    <span class="block text-xl font-extrabold tracking-tight leading-none">Rugby Ref Quiz</span>
                    <span class="block text-xs opacity-80 leading-tight">Train your Laws of the Game</span>
                </span>
            </a>
        </div>
    </header>

    <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-6 sm:py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-xs opacity-60 py-6 px-4">
        Unofficial training tool based on the World Rugby Laws of the Game.
    </footer>
</body>
</html>
